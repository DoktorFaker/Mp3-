const Tex=(()=>{
  const C={};
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];};
  const memo=(k,f)=>C[k]||(C[k]=f());
  const mkHi=(w,h)=>{const c=document.createElement('canvas');c.width=w*2;c.height=h*2;c.lw=w;c.lh=h;const x=c.getContext('2d');x.scale(2,2);return[c,x];};
  function floor(col){
    const S=48,[c,x]=mkHi(S,S);
    x.fillStyle='#04000a';x.fillRect(0,0,S,S);
    const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#1b0533');g.addColorStop(0.5,'#0e0320');g.addColorStop(1,'#060010');
    x.fillStyle=g;x.fillRect(2,2,S-4,S-4);
    const rg=x.createRadialGradient(S/2,S/2,2,S/2,S/2,S*0.6);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=0.18;x.fillStyle=rg;x.fillRect(2,2,S-4,S-4);x.globalAlpha=1;
    x.fillStyle='rgba(255,255,255,0.10)';x.fillRect(2,2,S-4,2);
    x.fillStyle='rgba(0,0,0,0.5)';x.fillRect(2,S-4,S-4,2);
    x.shadowBlur=6;x.shadowColor=col;x.strokeStyle=col;x.globalAlpha=0.55;x.lineWidth=1;x.strokeRect(1.5,1.5,S-3,S-3);
    x.shadowBlur=0;x.globalAlpha=0.7;x.fillStyle='#fff';
    [[4,4],[S-4,4],[4,S-4],[S-4,S-4]].forEach(([a,b])=>x.fillRect(a-1,b-1,2,2));
    x.globalAlpha=1;
    for(let i=0;i<60;i++){x.fillStyle=`rgba(255,255,255,${(Math.random()*0.05).toFixed(3)})`;x.fillRect(Math.random()*S,Math.random()*S,1,1);}
    return c;
  }
  function plat(col){
    const W=32,H=16,[c,x]=mkHi(W,H);
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4a4a5e');g.addColorStop(0.2,'#23232f');g.addColorStop(1,'#0a0a12');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,0.35)';x.fillRect(0,0,W,1);
    x.fillStyle='rgba(0,0,0,0.6)';x.fillRect(W-1,0,1,H);
    x.fillStyle='rgba(255,255,255,0.08)';x.fillRect(0,0,1,H);
    x.save();x.globalAlpha=0.14;x.fillStyle=col;
    for(let i=-H;i<W;i+=8){x.beginPath();x.moveTo(i,H);x.lineTo(i+4,H);x.lineTo(i+4+H*0.5,H*0.5);x.lineTo(i+H*0.5,H*0.5);x.fill();}
    x.restore();
    [[5,6],[W-6,6]].forEach(([a,b])=>{x.fillStyle='#000';x.beginPath();x.arc(a,b,1.8,0,TAU);x.fill();x.fillStyle='rgba(255,255,255,0.5)';x.fillRect(a-1,b-1.2,1,1);});
    return c;
  }
  function truss(){
    const W=120,H=26,[c,x]=mk(W,H);
    x.strokeStyle='#3a3a48';x.lineWidth=3;x.beginPath();x.moveTo(0,3);x.lineTo(W,3);x.moveTo(0,H-3);x.lineTo(W,H-3);x.stroke();
    x.lineWidth=1.5;x.strokeStyle='#2a2a36';x.beginPath();
    for(let i=0;i<W;i+=20){x.moveTo(i,3);x.lineTo(i+10,H-3);x.lineTo(i+20,3);}
    x.stroke();
    x.fillStyle='rgba(255,255,255,0.15)';x.fillRect(0,1.5,W,1);x.fillRect(0,H-4.5,W,1);
    return c;
  }
  function scanlines(){
    const[c,x]=mk(BASE_W,BASE_H);x.fillStyle='rgba(0,0,0,0.13)';
    for(let y=0;y<BASE_H;y+=3)x.fillRect(0,y,BASE_W,1);
    return c;
  }
  function vignette(){
    const[c,x]=mk(BASE_W,BASE_H);
    const g=x.createRadialGradient(BASE_W/2,BASE_H/2,BASE_H*0.32,BASE_W/2,BASE_H/2,BASE_H*0.92);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.72)');
    x.fillStyle=g;x.fillRect(0,0,BASE_W,BASE_H);
    return c;
  }
  return{
    floor:c=>memo('f'+c,()=>floor(c)),
    plat:c=>memo('p'+c,()=>plat(c)),
    truss:()=>memo('truss',truss),
    vignette:()=>memo('vig',vignette),
    scanlines:()=>memo('scan',scanlines),
  };
})();

const BG_SIZE=[[1342, 720], [900, 506], [1257, 515]];
const BG=(()=>{
  const imgs={},state={n:0,done:0};
  const load=src=>{const im=new Image();state.n++;im.onload=im.onerror=()=>{state.done++;};im.src=src;return im;};
  const raw={};for(const k in BG_DATA)raw[k]=load(BG_DATA[k]);
  const ok=im=>im&&im.complete&&im.naturalWidth>0;
  function build(i){
    if(imgs['near'+i])return true;
    const c=raw['nearc'+i],m=raw['neara'+i];if(!ok(c)||!ok(m))return false;
    try{
      const w=c.naturalWidth,h=c.naturalHeight,cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const x=cv.getContext('2d');x.drawImage(m,0,0,w,h);const md=x.getImageData(0,0,w,h).data;
      x.clearRect(0,0,w,h);x.drawImage(c,0,0,w,h);const id=x.getImageData(0,0,w,h),cd=id.data;
      for(let p=3;p<cd.length;p+=4)cd[p]=md[p-3];
      x.putImageData(id,0,0);imgs['near'+i]=cv;
    }catch(e){imgs['near'+i]=c;}
    return true;
  }
  return{
    imgs,
    get(kind,i){if(kind==='far')return ok(raw['far'+i])?raw['far'+i]:null;build(i);return imgs['near'+i]||null;},
    ready(){if(state.done<state.n)return false;for(let i=0;i<3;i++)build(i);return true;},
  };
})();

// ─── DYNAMIC LIGHTS (screen blend) ───────────────────────────────────────
class LightLayer{
  constructor(){this.lights=[];}
  add(x,y,r,color,life=0.25,intensity=0.7){if(this.lights.length<24)this.lights.push({x,y,r,color,life,maxLife:life,intensity});}
  update(dt){this.lights=this.lights.filter(l=>(l.life-=dt)>0);}
  glow(x,y,r,color,a){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  draw(extra){
    ctx.save();ctx.globalCompositeOperation='screen';
    if(extra)extra.forEach(e=>this.glow(e[0],e[1],e[2],e[3],e[4]));
    for(const l of this.lights)this.glow(l.x,l.y,l.r,l.color,(l.life/l.maxLife)*l.intensity);
    ctx.restore();
  }
}

// ─── VFX ─────────────────────────────────────────────────────────────────
class Particle{
  constructor(x,y,vx,vy,c,life,r=3,g=500){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.c=c;this.life=life;this.ml=life;this.r=r;this.g=g;}
  update(dt){this.vy+=this.g*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vx*=0.985;return(this.life-=dt)>0;}
  draw(){const a=this.life/this.ml,s=this.r*(0.4+0.6*a);ctx.globalAlpha=a;ctx.fillStyle=this.c;ctx.fillRect(this.x-s,this.y-s,s*2,s*2);}
}
class Slash{
  constructor(x,y,dir,c,sc=1){this.x=x;this.y=y;this.dir=dir;this.c=c;this.sc=sc;this.life=0.14;this.ml=0.14;}
  update(dt){return(this.life-=dt)>0;}
  draw(){
    const a=this.life/this.ml;
    ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.dir*this.sc,this.sc);ctx.globalAlpha=a;ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(0,0,18,0,0,58);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.7,this.c);g.addColorStop(1,'#ffffff');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,58,-1.7,1.25);ctx.arc(10,-4,44,1.15,-1.55,true);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
class ShockRing{
  constructor(x,y,c,s=1){this.x=x;this.y=y;this.c=c;this.s=s;this.r=10*s;this.life=0.5;}
  update(dt){this.r+=dt*330*this.s;return(this.life-=dt)>0;}
  draw(){
    const a=this.life/0.5;
    ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=this.c;ctx.lineWidth=4*a+1;ctx.shadowBlur=16;ctx.shadowColor=this.c;
    ctx.beginPath();ctx.ellipse(this.x,this.y,this.r,this.r*0.24,0,0,TAU);ctx.stroke();
    ctx.globalAlpha=a*0.5;ctx.beginPath();ctx.ellipse(this.x,this.y,this.r*0.6,this.r*0.15,0,0,TAU);ctx.stroke();
    ctx.restore();
  }
}
class Ring{
  constructor(x,y,c,s=1){this.x=x;this.y=y;this.c=c;this.s=s;this.r=6;this.life=0.4;}
  update(dt){this.r+=dt*260*this.s;return(this.life-=dt)>0;}
  draw(){const a=this.life/0.4;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=this.c;ctx.lineWidth=3*a+0.5;ctx.shadowBlur=12;ctx.shadowColor=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.stroke();ctx.restore();}
}
class Popup{
  constructor(x,y,txt,c){this.x=x;this.y=y;this.txt=txt;this.c=c;this.life=0.8;}
  update(dt){this.y-=45*dt;return(this.life-=dt)>0;}
  draw(){ctx.save();ctx.globalAlpha=Math.min(1,this.life*2);ctx.font=`bold 17px ${FONT}`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(this.txt,this.x,this.y);ctx.fillStyle=this.c;ctx.fillText(this.txt,this.x,this.y);ctx.restore();}
}
class Ghost{

// ─── LEVEL LAYOUT (ground segments, pits, floating platforms, boss arena) ─
class World{
  constructor(li){
    const R=mulberry(1234+li*71);
    this.AX=2600+li*260;
    this.ground=[];this.plats=[];
    this.ground.push({x:-400,w:this.AX+BASE_W+800,y:GROUND_Y});
    for(let px=380;px<this.AX-260;px+=200+R()*240){
      const w=90+R()*100;
      if(R()<0.4){
        this.plats.push({x:px,w:100,y:GROUND_Y-110});
        this.plats.push({x:px+90+R()*40,w,y:GROUND_Y-215-R()*20});
        px+=120;
      }else this.plats.push({x:px,w,y:GROUND_Y-100-R()*30});
    }
    const A=this.AX;
    this.plats.push({x:A+90,w:150,y:GROUND_Y-118},{x:A+BASE_W-240,w:150,y:GROUND_Y-118},{x:A+BASE_W/2-70,w:140,y:GROUND_Y-222});
    this.plats.forEach(p=>p.plat=true);
    this.all=[...this.ground,...this.plats];
    // a ladder up to every platform, down to the nearest floor below it
    const RL=mulberry(99+li*13);this.ladders=[];
    for(const p of this.plats){
      const lx=RL()<0.5?p.x+8:p.x+p.w-30,cx=lx+11;let bottom=GROUND_Y;
      for(const q of this.plats)if(q!==p&&q.y>p.y+20&&cx>=q.x&&cx<=q.x+q.w&&q.y<bottom)bottom=q.y;
      this.ladders.push({x:lx,w:22,top:p.y,bottom});
    }
  }
  ladderAt(cx,top,bot){return this.ladders.find(l=>Math.abs(cx-(l.x+l.w/2))<14&&bot>=l.top-2&&top<=l.bottom);}
  surfaces(){return this.all;}
  surfacesAt(x){return this.all.filter(s=>x>=s.x+10&&x<=s.x+s.w-44);}
}

class Backdrop{
  constructor(){
    this.motes=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),s:Math.random(),p:Math.random()*6}));
    this.gradeG={};
  }
  draw(camX,li,t,ac,beat){
    const lv=LEVELS[li],bi=li%3,far=BG.get('far',bi),near=BG.get('near',bi),sz=BG_SIZE[bi];
    const H=GROUND_Y+20,W=H*sz[0]/sz[1];
    ctx.fillStyle='#07020d';ctx.fillRect(0,0,BASE_W,BASE_H);
    // mirrored tiling keeps the photo seamless however far the camera scrolls
    const tile=(img,par,dy)=>{
      if(!img)return;
      let ox=-((camX*par)%(2*W));if(ox>0)ox-=2*W;
      for(let x=ox,k=0;x<BASE_W;x+=W,k++){
        if(x+W<0)continue;

    ctx.fillStyle=gg;ctx.fillRect(0,0,BASE_W,GROUND_Y+20);
    // atmosphere in front of the photo: snow / dust / embers

    for(const m of this.motes){
      let x,y,c,r;
      if(bi===0){x=m.x*BASE_W+Math.sin(t*0.6+m.p)*18-camX*0.25;y=(m.y*GROUND_Y+t*(14+m.s*22))%GROUND_Y;c='#dfefff';r=0.8+m.s*1.6;}

      else{const up=m.s>0.35;x=m.x*BASE_W+Math.sin(t+m.p)*14-camX*0.25;y=up?GROUND_Y-((m.y*GROUND_Y+t*(30+m.s*40))%GROUND_Y):(m.y*GROUND_Y+t*12)%GROUND_Y;c=up?'#ff7a1a':'#9a9a9a';r=up?0.8+m.s*1.5:1.2;}
      x=((x%(BASE_W+40))+BASE_W+40)%(BASE_W+40)-20;
      ctx.globalAlpha=0.35+0.35*Math.abs(Math.sin(t*1.7+m.p));ctx.fillStyle=c;ctx.fillRect(x-r,y-r,r*2,r*2);
      if(bi===0&&m.s>0.93){ctx.globalAlpha*=0.6;ctx.fillRect(x-r*4,y-0.5,r*8,1);ctx.fillRect(x-0.5,y-r*4,1,r*8);}
    }
    ctx.restore();ctx.globalAlpha=1;
    // sweeping club spotlights

    for(let i=0;i<3;i++){

    }

      ctx.restore();

    }

    for(let i=0;i<26;i++){const x=((i*131+t*45)%(BASE_W+40))-20,y=90+((i*71+t*12)%(GROUND_Y-110));ctx.globalAlpha=0.22+0.22*Math.sin(t*3+i);ctx.fillStyle=i%3?'#ffffff':ac;ctx.fillRect(x,y,2.5,2.5);}

// ─── PLAYER: FLY GIRL ────────────────────────────────────────────────────
class Player{
  constructor(){
    this.w=26;this.h=52;this.maxHp=10;this.hp=10;this.weapon=0;this.perk={};this.outfit=null;this.outfits=[];
    this.vamp=0;this.t=0;this.resetPos(80);
  }
  resetPos(x){
    this.x=x;this.y=GROUND_Y-this.h-1;this.vx=0;this.vy=0;this.dir=1;this.onGround=true;this.surf=null;
    this.inv=0;this.hurtT=0;this.atkT=0;this.atk=null;this.pending=null;this.jumps=0;this.dropT=0;this.coyote=0;this.diving=false;
    this.safeX=x;this.trailT=0;this.climbing=false;this.climbPh=0;this.held=false;
  }
  get speed(){return this.outfit==='raveJacket'?255:205;}
  get jumpV(){return this.outfit==='raveJacket'?-700:-630;}
  get kickR(){return this.outfit==='cyberKimono'?52:40;}
  get color(){return OUTFIT_COLORS[this.outfit]||'#ff007f';}
  hurtBox(){return{x:this.x+4,y:this.y+6,w:this.w-8,h:this.h-6};}
  kick(g,inp){
    if(this.atkT>0||this.hurtT>0)return;
    if(inp&&inp.down&&this.onGround&&!this.climbing){
      this.atk='lowkick';this.atkT=0.3;Sfx.kick();const r=this.kickR+8;
      this.pending={t:0.06,hb:{x:this.dir>0?this.x+this.w-4:this.x-r+4,y:this.y+this.h-24,w:r,h:24},dmg:10,kind:'lowkick',kb:120};
      return;
    }
    if(!this.onGround&&!this.climbing&&this.vy>-120&&!this.diving){
      this.diving=true;this.vy=760;this.vx=this.dir*250;this.atk='dive';this.atkT=0.1;Sfx.dive();return;
    }
    if(this.diving)return;
    this.atk='kick';this.atkT=0.26;Sfx.kick();
    const r=this.kickR;
    this.pending={t:0.05,hb:{x:this.dir>0?this.x+this.w-4:this.x-r+4,y:this.y+16,w:r,h:26},dmg:8,kind:'kick',kb:230};
  }
  weaponAtk(g){
    if(this.atkT>0||this.diving||this.hurtT>0)return;
    const grabbable=g.throwable();if(grabbable){g.judoThrow(grabbable);return;}
    if(this.weapon===0){
      this.atk='katana';this.atkT=0.24;Sfx.swing();
      const crit=!!this.perk.crit&&Math.random()<0.2;
      this.pending={t:0.04,hb:{x:this.dir>0?this.x+this.w-6:this.x-70+6,y:this.y-12,w:70,h:this.h+16},dmg:crit?24:12,crit,kind:'katana',kb:160};
      g.vfx.push(new Slash(this.x+this.w/2+this.dir*10,this.y+this.h*0.42,this.dir,'#00f3ff'));
    }else{
      this.atk='hammer';this.atkT=0.5;
      const cx=this.x+this.w/2;
      this.pending={t:0.2,hb:{x:this.dir>0?cx-30:cx-100,y:this.y-8,w:130,h:this.h+18},dmg:20,kind:'hammer',kb:380,stun:1.2};
    }
  }
  takeDamage(d,srcX,g){
    if(this.inv>0||this.hp<=0)return false;
    if(this.outfit==='stealth'&&Math.random()<0.1){this.inv=0.4;g.popup(this.x+this.w/2,this.y-10,'DODGE!','#aa00ff');return false;}
    if(this.outfit==='exoArmor')d*=0.8;
    this.hp=Math.max(0,this.hp-d);this.inv=1.2;this.hurtT=0.22;this.noCut=true;
    const s=(this.x+this.w/2)<srcX?-1:1;this.vx=s*270;this.vy=-320;this.onGround=false;
    this.diving=false;this.pending=null;this.atk=null;this.atkT=0;
    return true;
  }
  update(dt,inp,g){
    this.t+=dt;
    if(this.inv>0)this.inv-=dt;if(this.hurtT>0)this.hurtT-=dt;if(this.dropT>0)this.dropT-=dt;if(this.coyote>0)this.coyote-=dt;
    if(this.atkT>0){this.atkT-=dt;if(this.atkT<=0&&this.atk!=='dive')this.atk=null;}
    if(this.held){this.vx=0;this.vy=0;this.diving=false;this.climbing=false;return;}
    const ctl=this.hurtT<=0;
    let ax=0;if(ctl){if(inp.left)ax-=1;if(inp.right)ax+=1;}
    const lad=g.world.ladderAt(this.x+this.w/2,this.y,this.y+this.h),feet=this.y+this.h;
    const canUp=!!lad&&feet>lad.top+4;
    if(this.climbing){
      if(!lad||!ctl)this.climbing=false;
      else{
        const cv=(inp.up?-1:0)+(inp.down?1:0);
        this.vx=0;this.vy=cv*170;this.climbPh+=dt*Math.abs(cv)*10;
        this.x+=(lad.x+lad.w/2-this.w/2-this.x)*Math.min(1,dt*20);this.y+=this.vy*dt;
        if(inp.jumpP){this.climbing=false;this.vy=this.jumpV*0.8;this.vx=(ax||this.dir)*this.speed*0.6;if(ax)this.dir=ax;this.jumps=1;Sfx.jump();}
        else if(this.y+this.h<=lad.top){this.y=lad.top-this.h;this.climbing=false;this.vy=0;}
        else if(this.y+this.h>=lad.bottom&&cv>0){this.y=lad.bottom-this.h;this.climbing=false;this.vy=0;}
        else if(ax&&!cv){this.climbing=false;this.dir=ax;}
        if(this.climbing)return;
      }
    }else if(lad&&ctl&&!this.diving&&((inp.up&&canUp)||(inp.down&&this.onGround&&Math.abs(feet-lad.top)<3))){
      this.climbing=true;this.climbPh=0;this.vx=0;this.vy=0;this.onGround=false;this.pending=null;this.atk=null;this.atkT=0;
      if(inp.down)this.y+=4;
      return;
    }
    const jumpP=inp.jumpP||(inp.upP&&!canUp);
    if(!this.diving&&ctl){
      const heavy=this.atk==='hammer'?0.3:1;
      if(ax){this.vx+=(ax*this.speed*heavy-this.vx)*Math.min(1,dt*14);if(!this.atk)this.dir=ax;}
      else this.vx*=Math.pow(this.onGround?0.0004:0.05,dt);
    }
    if(ctl&&jumpP){
      if(inp.down&&this.onGround&&this.surf&&this.surf.plat){this.dropT=0.25;this.onGround=false;this.y+=2;}
      else if(this.onGround||this.coyote>0){this.vy=this.jumpV;this.noCut=!inp.kbJump;this.onGround=false;this.coyote=0;this.jumps=1;Sfx.jump();g.dust(this.x+this.w/2,this.y+this.h,6);}
      else if(this.perk.doubleJump&&this.jumps<2){this.vy=this.jumpV*0.88;this.noCut=!inp.kbJump;this.jumps=2;this.diving=false;this.atk=null;Sfx.jump();g.ring(this.x+this.w/2,this.y+this.h,this.color,0.6);}
    }
    if(this.vy>=0)this.noCut=false;
    if(!inp.jump&&this.vy<-260&&!this.diving&&this.hurtT<=0&&!this.noCut)this.vy=-260;
    this.vy=Math.min(this.vy+GRAV*dt,this.diving?950:820);
    const prevB=this.y+this.h,was=this.onGround;
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.x=clamp(this.x,g.minX,g.maxX-this.w);
    landOn(this,prevB,g.world.surfaces(),this.dropT>0);
    if(this.onGround){
      if(!was){
        if(this.diving){this.diving=false;this.atk=null;this.vx*=0.3;g.shock(this.x+this.w/2,this.y+this.h,this.color,0.7);g.shake(0.1);g.dust(this.x+this.w/2,this.y+this.h,10);}
        else g.dust(this.x+this.w/2,this.y+this.h,4);
      }
      this.jumps=0;this.coyote=0.09;
      if(!this.surf.plat&&this.x>this.surf.x+8&&this.x+this.w<this.surf.x+this.surf.w-8)this.safeX=this.x;
    }
    this.trailT-=dt;
    if(this.trailT<=0&&(Math.abs(this.vx)>150||!this.onGround)){
      this.trailT=0.035;
      g.vfx.push(new Particle(this.x+this.w/2-this.dir*8,this.y+this.h*(this.onGround?0.9:0.55),-this.dir*rnd(10,60),rnd(-30,10),Math.random()<0.5?this.color:'#00f3ff',0.35,2,-60));
    }
  }
  draw(){
    if(this.inv>0&&this.hurtT<=0&&Math.floor(this.inv*16)%2===0)return;
    const d=this.dir,oc=this.color,cx=this.x+this.w/2,cy=this.y,t=this.t;
    const run=this.onGround&&Math.abs(this.vx)>40,air=!this.onGround,ph=t*15;
    ctx.save();
    if(this.onGround){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(cx,cy+this.h,14,3.5,0,0,TAU);ctx.fill();}
    ctx.translate(cx,cy+this.h);
    if(run)ctx.rotate(d*0.08);
    if(this.diving)ctx.rotate(d*0.35);
    if(this.hurtT>0)ctx.rotate(-d*0.25);
    if(this.atk==='lowkick')ctx.scale(1,0.86);
    if(this.held)ctx.rotate(-d*0.12+Math.sin(t*30)*0.05);
    ctx.translate(-cx,-(cy+this.h));
    const prog=(dur)=>clamp(1-this.atkT/dur,0,1);
    let fl,bl,fa,ba;
    if(this.atk==='kick'){fl=-d*1.55;bl=d*0.2;}
    else if(this.diving){fl=-d*0.85;bl=-d*0.35;}
    else if(air){fl=-d*0.55;bl=d*0.45;}
    else if(run){fl=Math.sin(ph)*0.75;bl=-Math.sin(ph)*0.75;}
    else{fl=-d*0.05;bl=d*0.08;}
    const hammerIdle=this.weapon===1;
    if(this.atk==='katana'){const e=Math.min(1,prog(0.24)*1.6);fa=-d*(2.7-2.9*e);ba=d*0.5;}
    else if(this.atk==='hammer'){const q=prog(0.5);fa=q<0.35?d*(0.3+2.4*q/0.35):d*(2.7-4.0*clamp((q-0.35)/0.2,0,1));ba=-d*0.4;}
    else if(this.atk==='kick'){fa=d*0.9;ba=-d*0.6;}
    else if(this.diving){fa=d*2.4;ba=d*2.0;}
    else if(air){fa=hammerIdle?-d*1.6:-d*2.3;ba=d*0.8;}

const BOSS_LINES=["You're not on the list!","Drop the beat, babe!","Found you...","Fly with me, babe!","GAME OVER, BABE!","Too slow, babe!","Party foul!","Hostile takeover!","Which one is real?","Bow to the King of the Night!"];
// ─── BOSSES ──────────────────────────────────────────────────────────────
class Boss{
  constructor(cfg,li,g){
    this.name=cfg.name;this.color=cfg.color;this.w=cfg.w;this.h=cfg.h;this.hp=cfg.hp;this.maxHp=cfg.hp;this.beh=cfg.beh;this.li=li;
    this.A=g.world.AX;
    this.x=this.A+BASE_W-170-this.w/2;this.y=-this.h-40;this.vx=0;this.vy=0;this.dir=-1;this.t=0;this.hitT=0;
    this.st='enter';this.stT=0;this.cd=1.4;this.cd2=3;this.phase=1;this.alpha=1;this.contact=true;this.shield=0;
    this.fly=this.beh==='laser';this.hoverY=104;this.splitN=0;this.onGround=false;this.surf=null;this.mode=0;this.landed=true;this.ghostT=0;
  }
  talk(txt,force=true){this.say={txt,t:2.2};Voice.say(txt,'guy',{pitch:0.35+this.li*0.04,rate:0.9,seed:this.li,force});}
  get cx(){return this.x+this.w/2;}
  get cy(){return this.y+this.h/2;}
  box(){return{x:this.x+6,y:this.y+6,w:this.w-12,h:this.h-8};}
  damage(d,g){
    if(this.st==='enter'||this.shield>0||this.alpha<0.5){g.popup(this.cx,this.y-6,'BLOCK','#aaaaaa');return false;}
    this.hp-=d;this.hitT=0.1;

      const th=Math.floor((1-this.hp/this.maxHp)*4);
      while(this.splitN<th&&this.splitN<3){this.splitN++;for(const k of[-1,1])g.enemies.push(new Enemy('mini',clamp(this.cx+k*50,this.A+20,this.A+BASE_W-50),GROUND_Y,this.li));g.sparks(this.cx,this.cy,this.color,16);}
    }

  }
  update(dt,g){
    this.t+=dt;this.stT+=dt;if(this.hitT>0)this.hitT-=dt;if(this.shield>0)this.shield-=dt;
    if(this.say&&(this.say.t-=dt)<=0)this.say=null;
    const p=g.player,pcx=p.x+p.w/2,A=this.A;
    if(this.beh==='emperor'){

      if(ph!==this.phase){
        this.phase=ph;this.st='idle';this.stT=0;this.alpha=1;this.contact=true;this.vx=0;this.cd=1;this.fly=ph===3;
        g.banner={a:'PHASE '+ph,b:'THE EMPEROR EVOLVES',t:1.8,c:'#ff2244'};Sfx.roar();g.shake(0.5);g.ring(this.cx,this.cy,this.color,1.8);
      }
    }

      else{
        this.vy=Math.min(this.vy+GRAV*dt,900);const pb=this.y+this.h;this.y+=this.vy*dt;
        landOn(this,pb,g.world.ground,false);

      }
      return;
    }
    if(this.fly){
      if(this.st==='idle'){const tx=clamp(pcx-this.w/2+Math.sin(this.t*0.8)*160,A+20,A+BASE_W-this.w-20);this.x+=(tx-this.x)*Math.min(1,dt*1.2);}
      const ty=this.hoverY+Math.sin(this.t*2)*14;this.y+=(ty-this.y)*Math.min(1,dt*3);this.vy=0;

      if(li===6){ctx.fillStyle='#77ff00';for(let i=0;i<6;i++){ctx.globalAlpha=this.alpha*0.8;ctx.beginPath();ctx.ellipse(cx+(i-2.5)*13,this.y+18+((this.t*40+i*23)%(this.h*0.7)),2.2,3.4,0,0,TAU);ctx.fill();}ctx.globalAlpha=this.alpha;}
      if(li===8){ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ffffff';const sx=cx+Math.sin(this.t*3)*12,sy=cy+Math.cos(this.t*2.3)*20,r=3+2*Math.abs(Math.sin(this.t*6));ctx.fillRect(sx-r,sy-0.6,r*2,1.2);ctx.fillRect(sx-0.6,sy-r,1.2,r*2);ctx.globalCompositeOperation='source-over';}
      if(li===9&&this.phase===3){ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ff8800';for(const s of[-6,6]){ctx.beginPath();ctx.moveTo(cx+s-5,fy);ctx.lineTo(cx+s+5,fy);ctx.lineTo(cx+s,fy+22+Math.random()*12);ctx.closePath();ctx.fill();}ctx.globalCompositeOperation='source-over';}
    }
    if(this.shield>0){ctx.globalAlpha=0.35+0.15*Math.sin(this.t*20);ctx.strokeStyle='#88ffff';ctx.fillStyle='rgba(120,255,255,0.12)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,cy,this.w*0.85,this.h*0.62,0,0,TAU);ctx.fill();ctx.stroke();}

  }
  drawSay(){if(this.say)drawBubble(this.cx,this.y-(this.li===3?60:14),this.say.txt,this.color,Math.min(1,this.say.t*4));}
  _mech(cx,fy,c,L,P){
    const w=this.w,h=this.h,top=this.y,ph=this.walkPh||0,mv=P.mv,F=P.flash;

    }

    ctx.fillStyle='rgba(40,60,120,0.55)';ctx.beginPath();ctx.ellipse(cx,dy,rx,ry,0,0,TAU);ctx.fill();
    ctx.save();ctx.beginPath();ctx.ellipse(cx,dy,rx,ry,0,0,TAU);ctx.clip();drawDude(ctx,L,{...P,mv:0,lean:0,reach:0},cx,dy+43,this.dir,0.62);ctx.restore();
    ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,dy,rx,ry,0,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.ellipse(cx-rx*0.35,dy-ry*0.45,rx*0.3,ry*0.18,-0.4,0,TAU);ctx.fill();

    ctx.fillStyle=c;for(let i=0;i<5;i++)ctx.fillRect(cx-w/2+10+i*16,top+h*0.58,8,4);
    for(const s of[-1,1]){const bx=s<0?cx-w/2-18:cx+w/2+2;ctx.fillStyle=F?'#fff':'#444';ctx.fillRect(bx,top+h*0.34,16,22);ctx.fillStyle=c;ctx.fillRect(bx+(s>0?12:0),top+h*0.38,4,10);}
    ctx.fillStyle='#333';ctx.fillRect(this.dir>0?cx+w/2-4:cx-w/2-22,top+h*0.48,26,8);
  }
  _drone(cx,cy,c){
    const w=this.w,h=this.h,t=this.t;

}

// ─── PROJECTILES ─────────────────────────────────────────────────────────
const PROJ_R={glass:6,vinyl:12,block:16,star:8,orb:7,missile:7,wave:14,shot:6,acid:8};
class Proj{
  constructor(kind,x,y,vx,vy,color,dmg,o={}){
    this.kind=kind;this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.dmg=dmg;this.t=0;
    this.g=o.g||0;this.life=o.life||5;this.homing=o.homing||0;this.r=PROJ_R[kind]||7;this.owner=o.owner||null;
  }
  update(dt,g){
    this.t+=dt;const p=g.player;
    if(this.homing){
      const a=Math.atan2(p.y+p.h/2-this.y,p.x+p.w/2-this.x),cur=Math.atan2(this.vy,this.vx);
      let da=a-cur;da=Math.atan2(Math.sin(da),Math.cos(da));
      const na=cur+clamp(da,-this.homing*dt,this.homing*dt),ns=Math.min(Math.hypot(this.vx,this.vy)+dt*120,320);
      this.vx=Math.cos(na)*ns;this.vy=Math.sin(na)*ns;
      if(Math.random()<0.6)g.vfx.push(new Particle(this.x,this.y,rnd(-20,20),rnd(-20,20),'#ffaa44',0.3,2,0));
    }
    this.vy+=this.g*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.kind==='wave'){this.y=GROUND_Y-16;if(Math.random()<0.5)g.vfx.push(new Particle(this.x,GROUND_Y-2,rnd(-40,40),rnd(-160,-60),this.color,0.4,2.5,300));}
    else if(this.y+this.r>=GROUND_Y&&this.y<GROUND_Y+20&&g.groundAt(this.x)){this.explode(g);return false;}
    if(p.inv<=0&&circleRect(this.x,this.y,this.r*0.8,p.hurtBox())){g.hurtPlayer(this.dmg,this.x);if(this.owner&&this.owner.hp>0&&g.enemies.includes(this.owner))this.owner.speak(LINES_THROW_HIT,1.4,true);g.sparks(this.x,this.y,this.color,8);return false;}
    if((this.life-=dt)<=0)return false;
    return !(this.x<g.camX-120||this.x>g.camX+BASE_W+120||this.y>BASE_H+60||this.y<-500);
  }
  explode(g){
    if(this.kind==='vinyl'){g.explosion(this.x,GROUND_Y-12,58,this.color,2);}
    else if(this.kind==='block'){g.sparks(this.x,GROUND_Y-10,this.color,14,240);g.shake(0.12);Sfx.hit();
      const p=g.player;if(p.inv<=0&&Math.abs(p.x+p.w/2-this.x)<26&&p.y+p.h>GROUND_Y-20)g.hurtPlayer(this.dmg,this.x);}
    else if(this.kind==='glass'){g.sparks(this.x,GROUND_Y-6,'#e8f6ff',10,200);g.sparks(this.x,GROUND_Y-6,this.color,8,140);Sfx.glass();}
    else g.sparks(this.x,GROUND_Y-4,this.color,6,160);
  }
  draw(){
    const x=this.x,y=this.y,c=this.color;
    ctx.save();
    switch(this.kind){
      case'glass':
        ctx.translate(x,y);ctx.rotate(this.t*12);ctx.fillStyle=c;ctx.fillRect(-3,-2,6,6);
        ctx.strokeStyle='rgba(230,248,255,0.9)';ctx.lineWidth=1.2;ctx.strokeRect(-3.5,-6,7,10.5);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(-2.5,-5,1,8);break;
      case'vinyl':
        ctx.translate(x,y);ctx.rotate(this.t*14);
        ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.arc(0,0,12,0,TAU);ctx.fill();
        ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.shadowBlur=10;ctx.shadowColor=c;ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=0.7;ctx.beginPath();ctx.arc(0,0,8,0,2);ctx.stroke();
        ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill();break;
      case'block':{
        const warn=GROUND_Y-y;
        if(warn>40){ctx.globalAlpha=clamp(1-warn/600,0.15,0.8);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-12,GROUND_Y-2);ctx.lineTo(x+12,GROUND_Y-2);ctx.lineTo(x,GROUND_Y-16);ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
        ctx.translate(x,y);
        ctx.fillStyle=c;ctx.shadowBlur=14;ctx.shadowColor=c;ctx.fillRect(-16,-16,32,32);ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillRect(-16,-16,32,5);ctx.fillRect(-16,-16,5,32);
        ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(-16,11,32,5);ctx.fillRect(11,-16,5,32);break;}
      case'star':
        ctx.translate(x,y);ctx.rotate(this.t*20);ctx.fillStyle='#ddd';ctx.shadowBlur=10;ctx.shadowColor=c;
        ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?3:9,a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();break;
      case'missile':
        ctx.translate(x,y);ctx.rotate(Math.atan2(this.vy,this.vx));
        ctx.fillStyle='#ccc';ctx.fillRect(-8,-3,14,6);ctx.fillStyle=c;ctx.fillRect(4,-3,4,6);
        ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ff8800';ctx.beginPath();ctx.moveTo(-8,-3);ctx.lineTo(-16-Math.random()*6,0);ctx.lineTo(-8,3);ctx.fill();break;
      case'wave':{
        ctx.globalCompositeOperation='lighter';
        const wg=ctx.createLinearGradient(0,y-14,0,y+16);wg.addColorStop(0,'rgba(0,0,0,0)');wg.addColorStop(1,c);
        ctx.fillStyle=wg;ctx.beginPath();ctx.moveTo(x-18,y+16);ctx.quadraticCurveTo(x,y-26,x+18,y+16);ctx.closePath();ctx.fill();break;}
      case'acid':
        ctx.fillStyle=c;ctx.shadowBlur=10;ctx.shadowColor=c;ctx.beginPath();ctx.ellipse(x,y,8,6+Math.sin(this.t*20),0,0,TAU);ctx.fill();break;
      default:{
        ctx.globalCompositeOperation='lighter';
        const og=ctx.createRadialGradient(x,y,0,x,y,this.r*2);og.addColorStop(0,'#ffffff');og.addColorStop(0.35,c);og.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=og;ctx.beginPath();ctx.arc(x,y,this.r*2,0,TAU);ctx.fill();}
    }
    ctx.restore();
  }
}

// ─── PICKUPS (drinks + boss perk capsule) ────────────────────────────────
class Pickup{
  constructor(kind,x,y,perk){
    this.kind=kind;this.x=x;this.y=y;this.vy=-220;this.t=Math.random()*3;this.perk=perk;
    this.w=kind==='capsule'?26:16;this.h=kind==='capsule'?34:22;this.onGround=false;this.surf=null;this.life=kind==='drink'?14:1e9;
  }
  update(dt,g){
    this.t+=dt;const p=g.player,pcx=p.x+p.w/2,pcy=p.y+p.h/2,cx=this.x+this.w/2,cy=this.y+this.h/2;
    if(this.kind==='drink'&&p.perk.drinkMagnet&&Math.hypot(pcx-cx,pcy-cy)<180){this.x+=(pcx-cx)*dt*7;this.y+=(pcy-cy)*dt*7;this.vy=0;}
    else if(!this.onGround){this.vy=Math.min(this.vy+GRAV*0.6*dt,600);const pb=this.y+this.h;this.y+=this.vy*dt;landOn(this,pb,g.world.surfaces(),false);}
    if(overlap({x:this.x,y:this.y,w:this.w,h:this.h},p.hurtBox())){g.collect(this);return false;}
    return(this.life-=dt)>0&&this.y<BASE_H+40;
  }
  draw(){
    const bob=this.onGround?Math.sin(this.t*4)*2-2:0,x=this.x,y=this.y+bob;
    ctx.save();
    if(this.kind==='drink'){
      if(this.life<3&&Math.floor(this.t*10)%2)ctx.globalAlpha=0.4;
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.shadowBlur=12;ctx.shadowColor='#ff00ff';
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+16,y);ctx.lineTo(x+8,y+10);ctx.closePath();ctx.stroke();
      ctx.fillStyle='#ff00aa';ctx.beginPath();ctx.moveTo(x+2,y+1.5);ctx.lineTo(x+14,y+1.5);ctx.lineTo(x+8,y+8.5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+8,y+10);ctx.lineTo(x+8,y+19);ctx.moveTo(x+3,y+20);ctx.lineTo(x+13,y+20);ctx.stroke();
      ctx.strokeStyle='#00f3ff';ctx.beginPath();ctx.moveTo(x+10,y+3);ctx.lineTo(x+15,y-6);ctx.stroke();
      ctx.fillStyle='#39ff14';ctx.beginPath();ctx.arc(x+3,y,2.5,0,TAU);ctx.fill();
    }else{
      const c=this.perk.color,cx=x+this.w/2;
      ctx.globalCompositeOperation='lighter';
      const rg=ctx.createRadialGradient(cx,y+17,0,cx,y+17,50);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.35+0.15*Math.sin(this.t*5);ctx.fillStyle=rg;ctx.fillRect(cx-50,y-33,100,100);
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      const cg=ctx.createLinearGradient(x,0,x+this.w,0);cg.addColorStop(0,'#222');cg.addColorStop(0.5,c);cg.addColorStop(1,'#222');
      ctx.fillStyle=cg;ctx.shadowBlur=18;ctx.shadowColor=c;ctx.beginPath();ctx.roundRect(x,y,this.w,this.h,12);ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#000';ctx.fillRect(x+2,y+14,this.w-4,6);
      ctx.fillStyle='#fff';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.perk.tag,cx,y+17.5);
      ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(cx,y+17,22,6,Math.sin(this.t)*0.3,0,TAU);ctx.stroke();

// ─── ON-SCREEN CONTROLS (touch + mouse): side wings in landscape/PC, deck below in portrait ─
// Each finger is "owned" by the control it first touched, so sliding off the arrow pad keeps steering.
const FS_OK=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
class Touch{
  constructor(g){
    this.g=g;this.s={};this.p={};this.touches={};this.used=false;
    this.layout();
    const start=(id,p)=>{
      Voice.unlock();
      if(g.fsCard){g.fsCard=false;return;}
      const f=this.fsBtn,pb=this.pauseBtn;
      if(!STANDALONE&&Math.abs(p.x-f.x)<f.w/2+8&&Math.abs(p.y-f.y)<f.r+8){if(FS_OK)toggleFull();else if(IS_IOS)g.swipeFS();else g.fsHelp();return;}
      if(Math.hypot(p.x-pb.x,p.y-pb.y)<pb.r*1.5){if(g.state==='playing')g.pause();else if(g.state==='paused')g.resume();return;}
      let own=null;
      if(this.padHit(p))own='pad';
      else{let bd=1.45;for(const b of this.btns){const d=Math.hypot(p.x-b.x,p.y-b.y)/b.r;if(d<bd){bd=d;own=b.id;}}}
      this.touches[id]={x:p.x,y:p.y,own};
      if(g.state!=='playing')g.tap({x:p.x-GX,y:p.y-GY});
    };
    const move=(id,p)=>{
      const t=this.touches[id];if(!t)return;t.x=p.x;t.y=p.y;
      if(t.own&&t.own!=='pad'){const b=this.btns.find(q=>q.id===t.own);if(b&&Math.hypot(p.x-b.x,p.y-b.y)>b.r*2.4)t.own=null;}
    };
    const th=e=>{
      if(SWIPE.active){if(e.type==='touchend'){this.touches={};this.rebuild();}return;}
      e.preventDefault();this.used=true;Sfx.init();
      // sideways phone: keep asking for real fullscreen on touches until the browser grants it (or refuses twice)
      if(e.type==='touchstart'&&FS_OK&&fsFails<2&&!(document.fullscreenElement||document.webkitFullscreenElement)&&(innerWidth>innerHeight||!this.fsTried)){this.fsTried=true;toggleFull(true);}
      for(const t of e.changedTouches){
        const p=this.toBase(t.clientX,t.clientY);
        if(e.type==='touchend'||e.type==='touchcancel')delete this.touches[t.identifier];
        else if(e.type==='touchstart')start(t.identifier,p);
        else move(t.identifier,p);
      }
      this.rebuild();
    };
    ['touchstart','touchmove','touchend','touchcancel'].forEach(n=>canvas.addEventListener(n,th,{passive:false}));
    canvas.addEventListener('mousedown',e=>{Sfx.init();start('m',this.toBase(e.clientX,e.clientY));this.rebuild();});
    addEventListener('mousemove',e=>{if(this.touches.m){move('m',this.toBase(e.clientX,e.clientY));this.rebuild();}});
    addEventListener('mouseup',()=>{if(this.touches.m){delete this.touches.m;this.rebuild();}});
    document.addEventListener('touchmove',e=>{if(!SWIPE.active)e.preventDefault();},{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault());
  }
  layout(){
    if(LAND){
      const rb=Math.min(GX*0.2,26),cx=TW-GX/2,top=14+2*rb+16,bot=VH-10;
      this.fsBtn={x:GX/2,y:14+rb,r:rb,w:Math.min(GX*0.88,210)};this.pauseBtn={x:cx,y:14+rb,r:rb};
      // one big omnidirectional cross filling the lower left wing
      const size=Math.min(GX*0.98,(bot-top)*0.8,260);
      this.pad={kind:'cross',x:GX/2,y:bot-size/2-6,s:size/3.1};
      // four big buttons in a zig-zag column: JUMP (bottom), KICK, ATK, weapon
      const r=Math.min(GX*0.335,(bot-top)/7.7),ox=GX*0.125,dy=r*1.86,y1=bot-r*1.06;
      this.btns=[
        {id:'jump',x:cx+ox,y:y1,       r:r*1.06,label:'JUMP',key:'SPACE',c:'#00f3ff'},
        {id:'kick',x:cx-ox,y:y1-dy,    r,       label:'KICK',key:'J',    c:'#ff007f'},
        {id:'atk', x:cx+ox,y:y1-2*dy,  r,       label:'ATK', key:'L',    c:'#bd00ff'},
        {id:'wpn', x:cx-ox,y:y1-3*dy,  r,       label:'WPN', key:'K',    c:'#ffcc00'},
      ];
      return;
    }
    const by=BASE_H+PANEL-22,avail=PANEL-40;
    const s=Math.round(Math.min(118,avail/3.6,TW*0.14));
    this.pad={kind:'cross',x:24+s*1.55,y:by-s*1.6,s};
    const r=Math.min(80,avail*0.2),x2=TW-28-r,x1=x2-2*r-18,y2=by-r,y1=y2-2*r-18;
    this.btns=[
      {id:'jump',x:x2,y:y2,r:r*1.05,label:'JUMP',key:'SPACE',c:'#00f3ff'},
      {id:'kick',x:x1,y:y2,r,       label:'KICK',key:'J',    c:'#ff007f'},
      {id:'atk', x:x2,y:y1,r,       label:'ATK', key:'L',    c:'#bd00ff'},
      {id:'wpn', x:x1,y:y1,r,       label:'WPN', key:'K',    c:'#ffcc00'},
    ];
    this.fsBtn={x:TW/2-235,y:BASE_H+56,r:30,w:200};this.pauseBtn={x:TW/2+235,y:BASE_H+56,r:30};
  }
  toBase(x,y){const r=canvas.getBoundingClientRect();return{x:(x-r.left)*TW/r.width,y:(y-r.top)*VH/r.height};}
  padHit(p){
    const P=this.pad;
    if(LAND)return p.x<GX+6&&p.y>this.fsBtn.y+this.fsBtn.r+10;
    return p.y>BASE_H+80&&p.x<TW*0.5&&Math.hypot(p.x-P.x,p.y-P.y)<P.s*2.6;
  }
  padDir(p,s){
    // omnidirectional: the angle of the thumb from the pad centre picks one of 8 directions
    const P=this.pad,dx=p.x-P.x,dy=p.y-P.y;
    if(Math.hypot(dx,dy)<P.s*0.32)return;
    const a=Math.atan2(dy,dx),c=Math.cos(a),n=Math.sin(a);
    if(c>0.38)s.right=true;if(c<-0.38)s.left=true;if(n>0.38)s.down=true;if(n<-0.38)s.up=true;
  }
  rebuild(){
    const prev=this.s,s={};
    for(const t of Object.values(this.touches)){if(t.own==='pad')this.padDir(t,s);else if(t.own)s[t.own]=true;}
    for(const k in s)if(s[k]&&!prev[k])this.p[k]=true;
    this.s=s;
  }
  drawFsBtn(){
    const b=this.fsBtn,full=!!(document.fullscreenElement||document.webkitFullscreenElement),x0=b.x-b.w/2,y0=b.y-b.r,h=b.r*2;
    ctx.save();

    ctx.strokeStyle=pk.color;ctx.lineWidth=2;ctx.shadowBlur=24;ctx.shadowColor=pk.color;ctx.strokeRect(BASE_W/2-200,BASE_H/2-130,400,260);ctx.shadowBlur=0;
    this.neonText(pk.outfit?'NEW OUTFIT UNLOCKED':'PERK UNLOCKED',BASE_W/2,BASE_H/2-96,22,pk.color);
    ctx.save();ctx.translate(BASE_W/2,BASE_H/2-40);ctx.rotate(Math.sin(this.t*2)*0.1);
    ctx.fillStyle=pk.color;ctx.shadowBlur=30;ctx.shadowColor=pk.color;ctx.beginPath();ctx.roundRect(-22,-26,44,52,18);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font=`bold 21px ${FONT}`;ctx.fillText(pk.tag,0,1);ctx.restore();
    this.neonText(pk.name.toUpperCase(),BASE_W/2,BASE_H/2+20,20,'#ffffff',6);
    ctx.font=`18px ${FONT}`;ctx.fillStyle='#ccc';ctx.fillText(pk.desc,BASE_W/2,BASE_H/2+50);
    if(pk.outfit){ctx.font=`14px ${FONT}`;ctx.fillStyle=pk.color;ctx.fillText('Equipped. Swap outfits any time in the pause menu.',BASE_W/2,BASE_H/2+74);}
    if(this.stateT>0.7&&this.blink()){ctx.font=`bold 17px ${FONT}`;ctx.fillStyle='#39ff14';ctx.fillText((IS_TOUCH?'TAP':'PRESS ENTER')+' FOR LEVEL '+(this.li+2),BASE_W/2,BASE_H/2+108);}
    ctx.restore();
  }
  drawPause(){
    const p=this.player;ctx.save();this.overlay(0.75);ctx.textAlign='center';ctx.textBaseline='middle';
    this.neonText('PAUSED',BASE_W/2,120,40,'#00f3ff');
    ctx.font=`17px ${FONT}`;ctx.fillStyle='#aaa';ctx.fillText(`LEVEL ${this.li+1} · SCORE ${this.score}`,BASE_W/2,162);
    ctx.fillText('OUTFIT',BASE_W/2,256);
    const b=this.outfitBtn;
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor=p.color;ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;
    ctx.font=`bold 20px ${FONT}`;ctx.fillStyle=p.color;ctx.fillText('◀  '+(p.outfit?OUTFIT_NAMES[p.outfit]:'STREET (DEFAULT)')+'  ▶',BASE_W/2,b.y+b.h/2+1);
    ctx.font=`14px ${FONT}`;ctx.fillStyle='#888';
    ctx.fillText(p.outfits.length?(IS_TOUCH?'Tap the box to change outfit':'Press O to change outfit'):'Beat bosses on levels 2, 4, 6, 8 to unlock outfits',BASE_W/2,340);
    const vb=this.voiceBtn;ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(vb.x,vb.y,vb.w,vb.h);ctx.strokeStyle=Voice.on?'#39ff14':'#666';ctx.lineWidth=2;ctx.strokeRect(vb.x,vb.y,vb.w,vb.h);
    ctx.font=`bold 19px ${FONT}`;ctx.fillStyle=Voice.on?'#39ff14':'#888';ctx.fillText('VOICES: '+(Voice.on?'ON':'OFF')+(IS_TOUCH?'':'  (V)'),BASE_W/2,vb.y+vb.h/2+1);
    ctx.font=`14px ${FONT}`;ctx.fillStyle='#888';
    ctx.fillText(IS_TOUCH?'Tap anywhere else to resume':'P / ESC / ENTER to resume   ·   M: music '+(Sfx.musicOn?'ON':'OFF'),BASE_W/2,428);
    ctx.restore();
  }
  drawGameOver(){
    ctx.save();this.overlay(0.85);ctx.textAlign='center';ctx.textBaseline='middle';
    this.neonText('GAME OVER',BASE_W/2,BASE_H/2-50,54,'#ff2244',30);
    ctx.font=`20px ${FONT}`;ctx.fillStyle='#ccc';ctx.fillText(`LEVEL ${this.li+1} · ${this.lv.name.toUpperCase()}   SCORE ${this.score}`,BASE_W/2,BASE_H/2+4);
    if(this.stateT>1&&this.blink()){ctx.font=`bold 18px ${FONT}`;ctx.fillStyle='#39ff14';ctx.fillText(IS_TOUCH?'TAP TO RETRY':'PRESS ENTER TO RETRY',BASE_W/2,BASE_H/2+50);}
    ctx.restore();
  }
  drawWin(){
    ctx.save();this.overlay(0.85);ctx.textAlign='center';ctx.textBaseline='middle';
    const g=ctx.createLinearGradient(0,BASE_H/2-90,0,BASE_H/2-30);g.addColorStop(0,'#ff007f');g.addColorStop(0.5,'#00f3ff');g.addColorStop(1,'#bd00ff');
    ctx.font=`bold 73px ${FONT}`;ctx.fillStyle=g;ctx.shadowBlur=40;ctx.shadowColor='#ff007f';ctx.fillText('YOU WIN!',BASE_W/2,BASE_H/2-60);ctx.shadowBlur=0;
    ctx.font=`20px ${FONT}`;ctx.fillStyle='#00f3ff';ctx.fillText('THE CYBER EMPEROR HAS FALLEN. FLY GIRL RULES THE NIGHT.',BASE_W/2,BASE_H/2);
    this.neonText('FINAL SCORE '+this.score,BASE_W/2,BASE_H/2+36,20,'#ffcc00',12);
    if(this.stateT>1&&this.blink()){ctx.font=`bold 18px ${FONT}`;ctx.fillStyle='#39ff14';ctx.fillText(IS_TOUCH?'TAP TO PLAY AGAIN':'PRESS ENTER TO PLAY AGAIN',BASE_W/2,BASE_H/2+84);}
    ctx.restore();
  }
  drawLoading(){
    ctx.fillStyle='#050008';ctx.fillRect(0,0,BASE_W,BASE_H);
    const f=this.loadN?1-this.loadQ.length/this.loadN:0;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    this.neonText('FLY GIRL',BASE_W/2,BASE_H/2-50,40,'#ff007f',30);
    ctx.font=`17px ${FONT}`;ctx.fillStyle='#00f3ff';ctx.fillText('RENDERING NEON TEXTURES... '+Math.floor(f*100)+'%',BASE_W/2,BASE_H/2+4);
    if(lastError){ctx.font=`15px ${FONT}`;ctx.fillStyle='#ff6060';ctx.fillText('ERROR: '+lastError,BASE_W/2,BASE_H/2+70);}
    ctx.strokeStyle='#00f3ff';ctx.strokeRect(BASE_W/2-150,BASE_H/2+24,300,10);
    ctx.fillStyle='#ff007f';ctx.shadowBlur=12;ctx.shadowColor='#ff007f';ctx.fillRect(BASE_W/2-148,BASE_H/2+26,296*f,6);
    ctx.restore();
  }
  drawTitle(){
    const lv=LEVELS[0],beat=this.beat();
    this.bd.draw(this.camX,0,this.t,lv.ac,beat);
    if(!this.titlePat)this.titlePat=hiPattern(Tex.floor(lv.ac));
    ctx.save();ctx.translate(-(this.camX%48),GROUND_Y);ctx.fillStyle=this.titlePat;ctx.fillRect(0,0,BASE_W+48,BASE_H-GROUND_Y);
    const bt=this.beatInfo().n;ctx.globalCompositeOperation='lighter';
    for(let ci=0;ci<18;ci++)for(let r=0;r<2;r++)if((ci*7+r*13+bt*5)%11<4){ctx.globalAlpha=0.22+0.18*beat;ctx.fillStyle=DISCO[(ci+r+bt)%5];ctx.fillRect(ci*48+3,r*48+3,42,42);}
    ctx.restore();
    ctx.fillStyle=lv.ac;ctx.shadowBlur=12;ctx.shadowColor=lv.ac;ctx.fillRect(0,GROUND_Y,BASE_W,2);ctx.shadowBlur=0;
    const d=this.demo;d.x=150;d.y=GROUND_Y-d.h;d.dir=1;
    ctx.save();ctx.translate(163,GROUND_Y);ctx.scale(2.2,2.2);ctx.translate(-163,-GROUND_Y);d.draw();ctx.restore();
    const gt=this.t;
    drawDude(ctx,this.titleGuy,{mv:0,t:gt,seed:1,drunk:0.8,sip:Math.max(0,Math.sin(gt*0.9))**4,talk:Math.sin(gt*20)>0&&gt%2.2<1.5?1:0,brow:1,wink:gt%2.2>1.6},712,GROUND_Y,-1,1.25);
    if(this.t%2.2<1.5)drawBubble(712,GROUND_Y-112,LINES_FLIRT[this.titleLine],'#ff4fd8');
    ctx.drawImage(Tex.vignette(),0,0,BASE_W,BASE_H);
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`64px ${LOGO}`;
    const g=ctx.createLinearGradient(0,92,0,150);g.addColorStop(0,'#ffffff');g.addColorStop(0.45,'#9be7ff');g.addColorStop(0.5,'#1a1a4a');g.addColorStop(0.55,'#ff4fd8');g.addColorStop(1,'#ffd6f5');
    ctx.shadowBlur=30;ctx.shadowColor='#ff2a6d';ctx.fillStyle=g;ctx.fillText('FLY GIRL',490,122);ctx.shadowBlur=0;
    ctx.font=`italic bold 30px ${FONT}`;ctx.fillStyle='#ffd319';ctx.shadowBlur=14;ctx.shadowColor='#ff2a6d';ctx.fillText('NEON NIGHTS · 1986',490,176);ctx.shadowBlur=0;
    ctx.font=`20px ${FONT}`;ctx.fillStyle='#05d9e8';ctx.fillText("Creeps at the club? Kick 'em out!  10 clubs · 10 bosses",490,204);
    if(this.blink()){ctx.font=`bold 26px ${FONT}`;ctx.fillStyle='#39ff14';ctx.shadowBlur=12;ctx.shadowColor='#39ff14';ctx.fillText(IS_TOUCH?'TAP TO START':'PRESS ENTER TO START',490,240);ctx.shadowBlur=0;}
    ctx.font=`18px ${FONT}`;ctx.fillStyle='#d8c8e8';
    const lines=IS_TOUCH?['◀ ▶ MOVE   ▲ ▼ CLIMB LADDERS   JUMP: JUMP   ▼+JUMP: DROP','KICK in mid-air while falling = DIVE KICK','ATK: weapon attack   WPN: switch Katana / Hammer']
      :['← → MOVE   ↑ ↓ CLIMB LADDERS   SPACE: JUMP   ↓+SPACE: DROP','J: KICK  (J while falling = DIVE KICK)','K: SWITCH WEAPON   L: WEAPON ATTACK   P: PAUSE / OUTFITS','F or DOUBLE-CLICK: FULLSCREEN   M: MUSIC'];
    lines.forEach((l,i)=>ctx.fillText(l,395,276+i*19));
    ctx.restore();
    ctx.drawImage(Tex.scanlines(),0,0,BASE_W,BASE_H);
    if(this.banner)this.drawBanner();
    if(this.fsCard)this.drawFsCard();
    if(this.swipeCard)this.drawSwipeCard();
  }
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────
game=new Game();fit();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))return;if(dt>0.05)dt=0.05;
  if(game.hitStop>0)game.hitStop-=dt;else game.update(dt);
  game.draw();
}
requestAnimationFrame(frame);
</script>
