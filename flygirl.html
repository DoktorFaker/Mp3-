    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);

// PANEL = height of the control deck drawn BELOW the game screen (portrait phones); 0 = controls overlay the game (landscape/desktop)
let PANEL=0,TW=BASE_W,GX=0,game=null;
function fit(){
  const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
  if(!IS_TOUCH){PANEL=0;TW=BASE_W;}
  else if(h>=w*0.95){TW=BASE_W;PANEL=Math.round(clamp(BASE_W*h/w-BASE_H,300,900));}
  else{const sc=Math.min(h*0.58/BASE_H,w/BASE_W);PANEL=Math.round(clamp(h*0.42/sc,240,420));TW=Math.max(BASE_W,Math.round(w/sc));}
  GX=Math.round((TW-BASE_W)/2);
  RES=Math.min(RES0,2200/TW);
  const TH=BASE_H+PANEL,tw=Math.round(TW*RES),th=Math.round(TH*RES);
  if(canvas.width!==tw||canvas.height!==th){canvas.width=tw;canvas.height=th;}
  const s=Math.min(w/TW,h/TH);
  canvas.style.width=Math.floor(TW*s)+'px';canvas.style.height=Math.floor(TH*s)+'px';
  if(game)game.tc.layout();
}

function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function landOn(e,prevB,surfs,ignorePlats){
  e.onGround=false;e.surf=null;
  if(e.vy<0)return;
  const b=e.y+e.h;
  for(const s of surfs){
    if(s.plat&&ignorePlats)continue;
    if(e.x+e.w>s.x+3&&e.x<s.x+s.w-3&&prevB<=s.y+1&&b>=s.y){e.y=s.y-e.h;e.vy=0;e.onGround=true;e.surf=s;return;}
  }
}

// ─── AUDIO (Web Audio synth + club beat) ─────────────────────────────────
const Sfx=(()=>{
  let ac=null,master=null,musicG=null,noiseBuf=null,timer=null,nextT=0,step=0,root=55,musicOn=true;
  function init(){
    if(!ac){
      try{
        ac=new(window.AudioContext||window.webkitAudioContext)();
        master=ac.createGain();master.gain.value=0.8;master.connect(ac.destination);
        musicG=ac.createGain();musicG.gain.value=0.32;musicG.connect(master);
        noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*0.5),ac.sampleRate);
        const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      }catch(e){ac=null;}
    }
    if(ac&&ac.state==='suspended')ac.resume();
  }
  function tone(f,type,dur,vol,t0,slide,dest){
    if(!ac)return;const t=t0||ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(dur,vol,t0,hp,dest){
    if(!ac)return;const t=t0||ac.currentTime;
    const s=ac.createBufferSource();s.buffer=noiseBuf;
    const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1000;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+0.02);
  }
  const BASS=[0,0,12,0,7,0,10,12];
  function sched(){
    if(!ac||!musicOn)return;
    while(nextT<ac.currentTime+0.25){
      const s=step%16,bar=Math.floor(step/16)%4,t=nextT;
      if(s%4===0)tone(150,'sine',0.22,0.9,t,40,musicG);
      if(s%4===2)noise(0.04,0.22,t,7000,musicG);
      if(s===4||s===12)noise(0.12,0.3,t,1800,musicG);
      if(s%2===0){const prog=[0,0,5,7][bar];tone(root*2*Math.pow(2,(prog+BASS[(s/2)%8])/12),'sawtooth',0.11,0.16,t,0,musicG);}
      if(s===0&&bar%2===0)tone(root*8*Math.pow(2,[0,3,7,10][Math.floor(step/32)%4]/12),'triangle',0.5,0.05,t,0,musicG);
      nextT+=0.115;step++;
    }
  }
  return{
    init,
    startMusic(r){init();if(!ac)return;root=r||55;if(!timer){nextT=ac.currentTime+0.05;step=0;timer=setInterval(sched,40);}},
    stopMusic(){if(timer){clearInterval(timer);timer=null;}},
    toggleMusic(){musicOn=!musicOn;return musicOn;},
    get musicOn(){return musicOn;},
    kick(){tone(200,'square',0.08,0.16,0,70);noise(0.05,0.12,0,3000);},
    swing(){noise(0.09,0.16,0,4000);tone(900,'sawtooth',0.07,0.06,0,300);},
    hammer(){tone(90,'square',0.3,0.28,0,35);noise(0.25,0.28,0,200);},
    hit(){tone(300,'square',0.06,0.1,0,120);},
    pop(){tone(520,'square',0.12,0.08,0,90);noise(0.1,0.1,0,1500);},
    hurt(){tone(420,'sawtooth',0.25,0.16,0,90);},
    jump(){tone(330,'sine',0.12,0.1,0,660);},
    dive(){tone(800,'sawtooth',0.18,0.08,0,150);},
    explode(){noise(0.4,0.3,0,100);tone(80,'sine',0.4,0.28,0,30);},
    roar(){tone(70,'sawtooth',0.7,0.26,0,45);tone(105,'square',0.6,0.12,0,50);noise(0.6,0.18,0,300);},
    shoot(){tone(1200,'square',0.08,0.04,0,400);},
    laser(){tone(1500,'sawtooth',0.4,0.07,0,200);},
    glass(){tone(2400,'triangle',0.12,0.07,0,1800);noise(0.08,0.12,0,5000);},
    drink(){if(!ac)return;tone(660,'sine',0.08,0.12);tone(990,'sine',0.12,0.1,ac.currentTime+0.07);},
    perk(){if(!ac)return;[523,659,784,1047].forEach((f,i)=>tone(f,'sine',0.22,0.16,ac.currentTime+i*0.09));},
    level(){if(!ac)return;[392,523,659,784].forEach((f,i)=>tone(f,'square',0.14,0.07,ac.currentTime+i*0.07));},
    over(){if(!ac)return;[392,330,262,196].forEach((f,i)=>tone(f,'sawtooth',0.3,0.1,ac.currentTime+i*0.18));},
  };
})();

    for(let i=0;i<60;i++){x.fillStyle=`rgba(255,255,255,${(Math.random()*0.05).toFixed(3)})`;x.fillRect(Math.random()*S,Math.random()*S,1,1);}

  }
  function plat(col){
    const W=32,H=16,[c,x]=mk(W,H);
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4a4a5e');g.addColorStop(0.2,'#23232f');g.addColorStop(1,'#0a0a12');

    for(let i=-H;i<W;i+=8){x.beginPath();x.moveTo(i,H);x.lineTo(i+4,H);x.lineTo(i+4+H*0.5,H*0.5);x.lineTo(i+H*0.5,H*0.5);x.fill();}
    x.restore();
    [[5,6],[W-6,6]].forEach(([a,b])=>{x.fillStyle='#000';x.beginPath();x.arc(a,b,1.8,0,TAU);x.fill();x.fillStyle='rgba(255,255,255,0.5)';x.fillRect(a-1,b-1.2,1,1);});
    return c;
  }
  function wallPanel(col){

    x.fillStyle=sg;x.fillRect(2,1,W-4,H*0.28);

    [0.28,0.54,0.76].forEach(ty=>{x.beginPath();x.moveTo(5,H*ty);x.lineTo(W-5,H*ty);x.stroke();});
    x.globalAlpha=0.22;[0.2,0.8].forEach(tx=>{x.beginPath();x.moveTo(W*tx,8);x.lineTo(W*tx,H-8);x.stroke();});
    x.globalAlpha=0.75;x.fillStyle=col;[[W*0.2,H*0.28],[W*0.8,H*0.28],[W*0.5,H*0.54]].forEach(([a,b])=>x.fillRect(a-2,b-2,4,4));
    x.globalAlpha=0.5;x.strokeRect(0.5,0.5,W-1,H-1);x.globalAlpha=1;

  }
  function sign(text,col){

    x.fillStyle='rgba(4,0,12,0.92)';x.fillRect(0,0,W,H);
    x.shadowBlur=14;x.shadowColor=col;x.fillStyle=col;

  function skyline(kind,li){

          x.fillStyle='#05000a';for(let k=0;k<7;k++){const a=-Math.PI/2+(k-3)*0.48;x.beginPath();x.moveTo(px+lean,H-ph);x.quadraticCurveTo(px+lean+Math.cos(a)*16,H-ph+Math.sin(a)*16-6,px+lean+Math.cos(a)*30,H-ph+Math.sin(a)*30+8);x.quadraticCurveTo(px+lean+Math.cos(a)*14,H-ph+Math.sin(a)*14,px+lean,H-ph+3);x.fill();}}

        const hl=x.createLinearGradient(bx,0,bx+8,0);hl.addColorStop(0,'rgba(255,255,255,0.14)');hl.addColorStop(1,'rgba(255,255,255,0)');

        const warm=R()<0.5;
        for(let wy=top+14;wy<H-16;wy+=14)for(let wx=bx+8;wx<bx+bw-10;wx+=12){
          if(R()<0.35){const wc=warm&&R()<0.5?'#ffcf8a':lv.ac;x.fillStyle=wc;x.shadowColor=wc;x.shadowBlur=6;x.globalAlpha=0.35+R()*0.5;x.fillRect(wx,wy,5,7);}

class LightLayer{
  constructor(){this.lights=[];}
  add(x,y,r,color,life=0.25,intensity=0.7){if(this.lights.length<24)this.lights.push({x,y,r,color,life,maxLife:life,intensity});}
  update(dt){this.lights=this.lights.filter(l=>(l.life-=dt)>0);}
  glow(x,y,r,color,a){
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  draw(extra){
    ctx.save();ctx.globalCompositeOperation='screen';
    if(extra)extra.forEach(e=>this.glow(e[0],e[1],e[2],e[3],e[4]));
    for(const l of this.lights)this.glow(l.x,l.y,l.r,l.color,(l.life/l.maxLife)*l.intensity);
    ctx.restore();
  }
}

class Particle{

function drawBubble(x,y,txt,c,a=1){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`20px ${FONT}`;
  const w=ctx.measureText(txt).width+14,h=21,bx=x-w/2,by=y-h-9;
  ctx.fillStyle='#fff7fb';ctx.strokeStyle=c;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-5,by+h-1);ctx.lineTo(x+1,by+h+8);ctx.lineTo(x+5,by+h-1);ctx.closePath();ctx.fill();ctx.stroke();

  ctx.fillStyle='#1a0a20';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,by+h/2+1);
  ctx.restore();

class FallenDude{
  constructor(e,floorY){
    this.L=e.look;this.x=e.x+e.w/2;this.y=e.y+e.h;this.dir=e.dir;this.sc=e.sc;this.t=0;this.vy=Math.min(0,e.vy);
    this.vx=clamp(e.kb*0.4,-200,200);this.floorY=floorY;this.alpha=e.type==='clone'?0.5:1;
  }
  update(dt){
    this.t+=dt;
    if(this.y<this.floorY){this.vy+=GRAV*dt;this.y=Math.min(this.floorY,this.y+this.vy*dt);}
    this.x+=this.vx*dt;this.vx*=Math.pow(0.02,dt);
    return this.t<2&&this.y<BASE_H+150;
  }
  draw(){
    const f=Math.min(1,this.t/0.35),a=this.t>1.5?1-(this.t-1.5)/0.5:1;
    ctx.save();ctx.globalAlpha=Math.max(0,a)*this.alpha;
    drawDude(ctx,this.L,{fall:f,ko:true,hasDrink:false,t:this.t},this.x,this.y,this.dir,this.sc);
    if(f>=1){ctx.fillStyle='#ffff66';for(let i=0;i<3;i++){const an=this.t*5+i*TAU/3;ctx.fillRect(this.x-this.dir*62*this.sc+Math.cos(an)*8-1.5,this.y-14+Math.sin(an)*2.5-1.5,3,3);}}
    ctx.restore();
  }
}

// ─── LEVEL LAYOUT (ground segments, pits, floating platforms, boss arena) ─
class World{
  constructor(li){
    const R=mulberry(1234+li*71);
    this.AX=2600+li*260;
    this.ground=[];this.plats=[];
    let segStart=-400,x=520;
    while(x<this.AX-420){
      if(R()<0.3+li*0.02){
        const gap=80+R()*60;
        this.ground.push({x:segStart,w:x-segStart,y:GROUND_Y});
        if(R()<0.55)this.plats.push({x:x+gap/2-55,w:110,y:GROUND_Y-112-R()*20});
        segStart=x+gap;x=segStart+280+R()*220;
      }else x+=200+R()*200;
    }
    this.ground.push({x:segStart,w:this.AX+BASE_W+400-segStart,y:GROUND_Y});
    for(let px=380;px<this.AX-260;px+=200+R()*240){
      const w=90+R()*100;
      if(R()<0.4){
        this.plats.push({x:px,w:100,y:GROUND_Y-110});
        this.plats.push({x:px+90+R()*40,w,y:GROUND_Y-215-R()*20});
        px+=120;
      }else this.plats.push({x:px,w,y:GROUND_Y-100-R()*30});
    }
    const A=this.AX;
    this.plats.push({x:A+90,w:150,y:GROUND_Y-118},{x:A+BASE_W-240,w:150,y:GROUND_Y-118},{x:A+BASE_W/2-70,w:140,y:GROUND_Y-222});
    this.plats.forEach(p=>p.plat=true);
    this.all=[...this.ground,...this.plats];
  }
  surfaces(){return this.all;}
  surfacesAt(x){return this.all.filter(s=>x>=s.x+10&&x<=s.x+s.w-44);}
}

  constructor(){
    this.stars=Array.from({length:60},()=>({x:Math.random()*BASE_W,y:Math.random()*250,s:Math.random()*1.4+0.4,p:Math.random()*6}));

    ctx.fillStyle=g;ctx.fillRect(0,0,BASE_W,BASE_H);

// ─── PLAYER: FLY GIRL ────────────────────────────────────────────────────
class Player{
  constructor(){
    this.w=26;this.h=52;this.maxHp=10;this.hp=10;this.weapon=0;this.perk={};this.outfit=null;this.outfits=[];
    this.vamp=0;this.t=0;this.resetPos(80);
  }
  resetPos(x){
    this.x=x;this.y=GROUND_Y-this.h-1;this.vx=0;this.vy=0;this.dir=1;this.onGround=true;this.surf=null;
    this.inv=0;this.hurtT=0;this.atkT=0;this.atk=null;this.pending=null;this.jumps=0;this.dropT=0;this.coyote=0;this.diving=false;
    this.safeX=x;this.trailT=0;

  get speed(){return this.outfit==='raveJacket'?255:205;}
  get jumpV(){return this.outfit==='raveJacket'?-700:-630;}

  hurtBox(){return{x:this.x+4,y:this.y+6,w:this.w-8,h:this.h-6};}
  kick(g){
    if(this.atkT>0||this.hurtT>0)return;
    if(!this.onGround&&this.vy>-120&&!this.diving){
      this.diving=true;this.vy=760;this.vx=this.dir*250;this.atk='dive';this.atkT=0.1;Sfx.dive();return;
    }
    if(this.diving)return;
    this.atk='kick';this.atkT=0.26;Sfx.kick();
    const r=this.kickR;
    this.pending={t:0.05,hb:{x:this.dir>0?this.x+this.w-4:this.x-r+4,y:this.y+16,w:r,h:26},dmg:8,kind:'kick',kb:230};
  }
  weaponAtk(g){
    if(this.atkT>0||this.diving||this.hurtT>0)return;
    if(this.weapon===0){
      this.atk='katana';this.atkT=0.24;Sfx.swing();
      const crit=!!this.perk.crit&&Math.random()<0.2;
      this.pending={t:0.04,hb:{x:this.dir>0?this.x+this.w-6:this.x-70+6,y:this.y-12,w:70,h:this.h+16},dmg:crit?24:12,crit,kind:'katana',kb:160};
      g.vfx.push(new Slash(this.x+this.w/2+this.dir*10,this.y+this.h*0.42,this.dir,'#00f3ff'));
    }else{
      this.atk='hammer';this.atkT=0.5;
      const cx=this.x+this.w/2;
      this.pending={t:0.2,hb:{x:this.dir>0?cx-30:cx-100,y:this.y-8,w:130,h:this.h+18},dmg:20,kind:'hammer',kb:380,stun:1.2};
    }
  }
  takeDamage(d,srcX,g){
    if(this.inv>0||this.hp<=0)return false;
    if(this.outfit==='stealth'&&Math.random()<0.1){this.inv=0.4;g.popup(this.x+this.w/2,this.y-10,'DODGE!','#aa00ff');return false;}
    if(this.outfit==='exoArmor')d*=0.8;
    this.hp=Math.max(0,this.hp-d);this.inv=1.2;this.hurtT=0.22;this.noCut=true;
    const s=(this.x+this.w/2)<srcX?-1:1;this.vx=s*270;this.vy=-320;this.onGround=false;

  update(dt,inp,g){

// ─── ENEMIES: drunk club guys hitting on Fly Girl ────────────────────────
const ENEMY_STATS={dude:[28,16,58,100],thrower:[28,12,36,120],mini:[24,10,95,60],clone:[30,1,60,200]};
class Enemy{
  constructor(type,x,y,li,look,sc){

    this.spd=S[2]+(type==='dude'?li*6:0);this.score=S[3];
    this.color=LEVELS[li].ec;
    this.x=x;this.y=y-this.h;
    this.vx=0;this.vy=0;this.dir=-1;this.kb=0;this.stun=0;this.hitT=0;this.onGround=false;this.surf=null;this.contact=false;
    this.st='walk';this.stT=0;this.flirtCd=rnd(0.4,1.8);this.say=null;this.ph=Math.random()*6;this.seed=Math.random()*9;
    this.drunk=rnd(0.35,1);this.sip=0;this.reach=0;this.hasDrink=true;this.throwCd=rnd(1.2,2.6);this.throwA=null;this.refill=0;this.shootT=rnd(1.2,2.4);
  }
  get liq(){return LIQ[this.look.drink]||'#ffffff';}
  box(){return{x:this.x+2,y:this.y+6,w:this.w-4,h:this.h-6};}
  speak(lines,dur=1.3){this.say={txt:Array.isArray(lines)?pick(Math.random,lines):lines,t:dur};}
  damage(d,dir,kb,stun){
    this.hp-=d;this.hitT=0.16;this.kb=dir*(kb||150);this.dir=-dir;
    if(stun)this.stun=Math.max(this.stun,stun);
    this.vy=Math.min(this.vy,-150);
    this.st='walk';this.stT=0;this.flirtCd=Math.max(this.flirtCd,1.2);this.reach=0;this.throwA=null;
    if(this.hp>0&&Math.random()<0.35)this.speak(LINES_OUCH,0.9);
  }
  update(dt,g){
    this.t+=dt;this.stT+=dt;if(this.hitT>0)this.hitT-=dt;if(this.stun>0)this.stun-=dt;if(this.flirtCd>0)this.flirtCd-=dt;
    if(this.say&&(this.say.t-=dt)<=0)this.say=null;
    this.kb*=Math.pow(0.02,dt);
    const p=g.player,pcx=p.x+p.w/2,cx=this.x+this.w/2,adx=Math.abs(pcx-cx);
    const sameLvl=Math.abs((p.y+p.h)-(this.y+this.h))<70,near=adx<380&&sameLvl;
    let want=0;
    if(this.stun>0){this.st='walk';}
    else if(this.type==='thrower'){
      this.dir=pcx<cx?-1:1;
      if(this.throwA!=null){
        this.throwA+=dt/0.6;
        if(this.throwA>=0.6&&!this.thrown){this.thrown=true;this.hasDrink=false;g.throwDrink(this);}
        if(this.throwA>=1){this.throwA=null;this.refill=1.1;}
      }else{
        if(this.refill>0&&(this.refill-=dt)<=0)this.hasDrink=true;
        this.throwCd-=dt;
        if(this.throwCd<=0&&this.hasDrink&&adx<470&&adx>50){
          this.throwA=0;this.thrown=false;this.throwCd=Math.max(1.8,rnd(2.6,4)-this.li*0.12);
          if(Math.random()<0.5)this.speak(LINES_THROW,1);
        }else if(!near&&Math.random()<dt*0.2){this.st='sip';this.stT=0;}
        if(this.st==='sip'){this.sip=Math.min(1,this.sip+dt*3);if(this.stT>1)this.st='walk';}else this.sip=Math.max(0,this.sip-dt*3);
      }
    }else if(this.type==='clone'){
      this.dir=pcx<cx?-1:1;want=adx>170?0.7:0;
      this.shootT-=dt;
      if(this.shootT<=0){this.shootT=rnd(1.6,2.6);g.fireAt(cx+this.dir*14,this.y+this.h*0.3,pcx,p.y+p.h/2,240,LEVELS[this.li].boss.color,1);Sfx.shoot();this.reach=1;}
      this.reach=Math.max(0,this.reach-dt*2);
    }else{
      switch(this.st){
        case'walk':
          if(near){this.dir=pcx<cx?-1:1;want=1;if(adx<175&&this.flirtCd<=0){this.st='flirt';this.stT=0;this.speak(LINES_FLIRT,1.5);g.hearts(this);}}
          else{want=0.6;if(adx<1100&&Math.random()<dt*0.9)this.dir=pcx<cx?-1:1;if(Math.random()<dt*0.12){this.st='sip';this.stT=0;}}
          break;
        case'sip':if(this.stT>1.1||near)this.st='walk';break;
        case'flirt':this.dir=pcx<cx?-1:1;want=0.3;if(this.stT>1){this.st='lunge';this.stT=0;}break;
        case'lunge':
          this.dir=pcx<cx?-1:1;want=1.9;
          if(adx<this.w/2+p.w/2+16&&sameLvl){this.st='grab';this.stT=0;this.grabbed=false;}
          else if(this.stT>1.3||!sameLvl){this.st='walk';this.flirtCd=rnd(1,2);}
          break;
        case'grab':
          this.reach=Math.min(1,this.stT/0.22);
          if(this.stT>=0.22&&!this.grabbed){
            this.grabbed=true;
            const hb={x:this.dir>0?this.x+this.w-2:this.x-26,y:this.y+this.h*0.2,w:28,h:this.h*0.4};
            if(overlap(hb,p.hurtBox())){g.hurtPlayer(1,cx);if(Math.random()<0.5)this.speak(LINES_GRAB,1);}
          }
          if(this.stT>0.6){this.st='walk';this.flirtCd=rnd(1.4,2.8);}
          break;
      }
      if(this.st==='sip')this.sip=Math.min(1,this.sip+dt*3);else this.sip=Math.max(0,this.sip-dt*3);
      if(this.st!=='grab')this.reach=Math.max(0,this.reach-dt*4);
      if(this.type==='mini'&&this.onGround&&Math.random()<dt*0.5)this.vy=-380;
    }
    this.vx=this.stun>0?0:this.dir*this.spd*want;
    this.vy=Math.min(this.vy+GRAV*dt,820);
    const prevB=this.y+this.h;
    let nx=this.x+(this.vx+this.kb)*dt;
    if(this.onGround&&this.surf&&Math.abs(this.kb)<60&&(nx<this.surf.x||nx+this.w>this.surf.x+this.surf.w)){nx=this.x;if(!near&&this.type!=='thrower')this.dir*=-1;}
    this.x=clamp(nx,g.minX,g.maxX-this.w);
    this.y+=this.vy*dt;
    landOn(this,prevB,g.world.surfaces(),false);
    this.ph+=dt*Math.abs(this.vx)*0.11/this.sc;
  }
  draw(){
    const cx=this.x+this.w/2,fy=this.y+this.h;
    if(this.onGround){ctx.fillStyle='rgba(0,0,0,0.42)';ctx.beginPath();ctx.ellipse(cx,fy,15*this.sc,3.6,0,0,TAU);ctx.fill();}
    const st=this.st;
    const P={mv:Math.min(1,Math.abs(this.vx)/35),ph:this.ph,t:this.t,seed:this.seed,drunk:this.stun>0?1:this.drunk,
      lean:(st==='lunge'?0.2:st==='flirt'?0.07:0)+(st==='grab'?0.22*this.reach:0),
      reach:st==='flirt'?0.45:this.reach,talk:this.say?(Math.sin(this.t*24)>0?1:0.3):0,wink:st==='flirt'&&Math.sin(this.t*4)>0.2,brow:st==='flirt'||st==='lunge'?1:0,
      sip:this.sip,flinch:this.hitT>0?1:0,flash:this.hitT>0.08,hasDrink:this.hasDrink,throwA:this.throwA,alpha:this.type==='clone'?0.55:1,
      nod:this.stun>0?Math.sin(this.t*6)*0.2:0};
    drawDude(ctx,this.look,P,cx,fy,this.dir,this.sc);
    if(this.type==='clone'){ctx.fillStyle='rgba(180,240,255,0.5)';for(let i=0;i<3;i++)ctx.fillRect(this.x+rnd(-6,6),this.y+Math.random()*this.h,this.w,1.5);}
    if(this.stun>0){ctx.fillStyle='#ffff66';for(let i=0;i<3;i++){const a=this.t*6+i*TAU/3;ctx.fillRect(cx+Math.cos(a)*11-1.5,this.y-4+Math.sin(a)*3-1.5,3,3);}}
    if(this.hp<this.maxHp&&this.hp>0&&this.maxHp>1){
      const bw=30;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(cx-bw/2,this.y-12,bw,4);
      ctx.fillStyle=this.hp/this.maxHp>0.5?'#39ff14':'#ff3322';ctx.fillRect(cx-bw/2,this.y-12,bw*this.hp/this.maxHp,4);
    }
  }
  drawSay(){if(this.say)drawBubble(this.x+this.w/2,this.y-14,this.say.txt,LEVELS[this.li].ac,Math.min(1,this.say.t*4));}
}

const BOSS_LINES=["You're not on the list!","Drop the beat, babe!","Found you...","Fly with me, babe!","GAME OVER, BABE!","Too slow, babe!","Party foul!","Hostile takeover!","Which one is real?","Bow to the King of the Night!"];
// ─── BOSSES ──────────────────────────────────────────────────────────────
class Boss{
  constructor(cfg,li,g){
    this.name=cfg.name;this.color=cfg.color;this.w=cfg.w;this.h=cfg.h;this.hp=cfg.hp;this.maxHp=cfg.hp;this.beh=cfg.beh;this.li=li;
    this.A=g.world.AX;
    this.x=this.A+BASE_W-170-this.w/2;this.y=-this.h-40;this.vx=0;this.vy=0;this.dir=-1;this.t=0;this.hitT=0;
    this.st='enter';this.stT=0;this.cd=1.4;this.cd2=3;this.phase=1;this.alpha=1;this.contact=true;this.shield=0;
    this.fly=this.beh==='laser';this.hoverY=104;this.splitN=0;this.onGround=false;this.surf=null;this.mode=0;this.landed=true;this.ghostT=0;
  }
  get cx(){return this.x+this.w/2;}
  get cy(){return this.y+this.h/2;}
  box(){return{x:this.x+6,y:this.y+6,w:this.w-12,h:this.h-8};}
  damage(d,g){
    if(this.st==='enter'||this.shield>0||this.alpha<0.5){g.popup(this.cx,this.y-6,'BLOCK','#aaaaaa');return false;}
    this.hp-=d;this.hitT=0.1;
    if(this.beh==='splits'){
      const th=Math.floor((1-this.hp/this.maxHp)*4);
      while(this.splitN<th&&this.splitN<3){this.splitN++;for(const k of[-1,1])g.enemies.push(new Enemy('mini',clamp(this.cx+k*50,this.A+20,this.A+BASE_W-50),GROUND_Y,this.li));g.sparks(this.cx,this.cy,this.color,16);}
    }
    return true;
  }
  update(dt,g){
    this.t+=dt;this.stT+=dt;if(this.hitT>0)this.hitT-=dt;if(this.shield>0)this.shield-=dt;
    if(this.say&&(this.say.t-=dt)<=0)this.say=null;
    const p=g.player,pcx=p.x+p.w/2,A=this.A;
    if(this.beh==='emperor'){
      const ph=this.hp<this.maxHp*0.33?3:this.hp<this.maxHp*0.66?2:1;
      if(ph!==this.phase){
        this.phase=ph;this.st='idle';this.stT=0;this.alpha=1;this.contact=true;this.vx=0;this.cd=1;this.fly=ph===3;
        g.banner={a:'PHASE '+ph,b:'THE EMPEROR EVOLVES',t:1.8,c:'#ff2244'};Sfx.roar();g.shake(0.5);g.ring(this.cx,this.cy,this.color,1.8);
      }
    }
    if(this.st==='enter'){
      if(this.fly){this.y+=(this.hoverY-this.y)*Math.min(1,dt*2.5);if(Math.abs(this.y-this.hoverY)<4){this.st='idle';Sfx.roar();g.shake(0.3);this.say={txt:BOSS_LINES[this.li],t:2.2};}}
      else{
        this.vy=Math.min(this.vy+GRAV*dt,900);const pb=this.y+this.h;this.y+=this.vy*dt;
        landOn(this,pb,g.world.ground,false);
        if(this.onGround){this.st='idle';g.shake(0.5);Sfx.roar();this.say={txt:BOSS_LINES[this.li],t:2.2};g.shock(this.cx,GROUND_Y,this.color,1.5);g.dust(this.cx,GROUND_Y,16);}
      }
      return;
    }
    if(this.fly){
      if(this.st==='idle'){const tx=clamp(pcx-this.w/2+Math.sin(this.t*0.8)*160,A+20,A+BASE_W-this.w-20);this.x+=(tx-this.x)*Math.min(1,dt*1.2);}
      const ty=this.hoverY+Math.sin(this.t*2)*14;this.y+=(ty-this.y)*Math.min(1,dt*3);this.vy=0;
    }else{
      this.vy=Math.min(this.vy+GRAV*dt,900);const pb=this.y+this.h;
      this.x+=this.vx*dt;this.y+=this.vy*dt;
      landOn(this,pb,g.world.ground,false);
    }
    this.hitWall=false;
    if(this.x<A+4){this.x=A+4;this.hitWall=true;}
    else if(this.x>A+BASE_W-this.w-4){this.x=A+BASE_W-this.w-4;this.hitWall=true;}
    if(this.st==='idle')this.dir=pcx<this.cx?-1:1;
    this['b_'+this.beh](dt,g,p,pcx);
    this.walkPh=(this.walkPh||0)+Math.abs(this.vx)*dt*0.11*80/this.h;
  }
  // L1 — charges across the club, gets dizzy on the wall
  b_charger(dt,g,p,pcx){
    if(this.st==='idle'){this.vx=this.dir*70;this.cd-=dt;if(this.cd<=0){this.st='windup';this.stT=0;this.vx=0;Sfx.roar();}}
    else if(this.st==='windup'){this.vx=0;if(this.stT>0.55){this.st='charge';this.stT=0;this.vx=this.dir*(520+this.li*15);}}
    else if(this.st==='charge'){
      if(Math.random()<0.5)g.dust(this.cx-this.dir*this.w/2,GROUND_Y,1);
      if(this.hitWall||this.stT>2){this.st='stun';this.stT=0;this.vx=0;g.shake(0.35);Sfx.hammer();g.sparks(this.dir>0?this.x+this.w:this.x,this.cy,this.color,14);}
    }
    else if(this.st==='stun'){if(this.stT>1.1){this.st='idle';this.cd=Math.max(0.7,rnd(1.2,2)-this.li*0.05);}}
  }
  // L2 — lobs exploding vinyl records
  b_vinyl(dt,g,p,pcx){
    const want=pcx<this.A+BASE_W/2?this.A+BASE_W-this.w-60:this.A+60;
    this.vx=clamp((want-this.x)*1.5,-130,130);
    if(this.onGround&&Math.random()<dt*0.35)this.vy=-600;
    this.cd-=dt;
    if(this.cd<=0){
      this.cd=1.5;const n=this.hp<this.maxHp/2?3:2;
      for(let i=0;i<n;i++){
        const tt=0.85+i*0.28,sy=this.y+20,G=900;
        const vx=(pcx-this.cx)/tt+rnd(-50,50),vy=((GROUND_Y-12-sy)-0.5*G*tt*tt)/tt;
        g.projs.push(new Proj('vinyl',this.cx,sy,vx,vy,this.color,2,{g:G}));
      }
      Sfx.shoot();
    }
  }
  // L3 — vanishes and reappears behind you
  b_teleport(dt,g,p,pcx){
    if(this.st==='idle'){this.vx=this.dir*90;this.cd-=dt;if(this.cd<=0){this.st='vanish';this.stT=0;this.vx=0;Sfx.laser();g.glitch(this);}}
    else if(this.st==='vanish'){
      this.alpha=Math.max(0,1-this.stT/0.3);this.contact=false;
      if(this.stT>0.45){
        const side=Math.random()<0.5?-1:1;
        this.x=clamp(pcx+side*90-this.w/2,this.A+4,this.A+BASE_W-this.w-4);this.y=GROUND_Y-this.h;this.vy=0;
        this.dir=pcx<this.cx?-1:1;this.st='appear';this.stT=0;g.glitch(this);
      }
    }
    else if(this.st==='appear'){
      this.alpha=Math.min(1,this.stT/0.2);
      if(this.stT>0.42){
        this.contact=true;this.st='slash';this.stT=0;Sfx.swing();
        g.vfx.push(new Slash(this.cx+this.dir*14,this.cy,this.dir,this.color,1.6));
        const hb={x:this.dir>0?this.cx:this.cx-95,y:this.y,w:95,h:this.h};
        if(overlap(hb,p.hurtBox()))g.hurtPlayer(2,this.cx);
      }
    }
    else if(this.st==='slash'){if(this.stT>0.5){this.st='idle';this.cd=rnd(1.1,1.8);if(Math.random()<0.5){g.fireAt(this.cx,this.cy,pcx,p.y+p.h/2,300,this.color,1);Sfx.shoot();}}}
  }
  // L4 — flying, laser spreads + orbital beam strikes
  b_laser(dt,g,p,pcx){
    if(this.st==='idle'){
      this.cd-=dt;
      if(this.cd<=0){
        this.mode^=1;
        if(this.mode){for(let i=-2;i<=2;i++)g.fireAt(this.cx,this.y+this.h,pcx+i*70,GROUND_Y,260,this.color,1);Sfx.shoot();this.cd=1.4;}
        else{
          this.st='beam';this.stT=0;
          g.beams.push({x:pcx,t:0,warn:0.8,dur:0.6,w:28,c:this.color});
          if(this.hp<this.maxHp/2)g.beams.push({x:clamp(pcx+(Math.random()<0.5?-150:150),this.A+30,this.A+BASE_W-30),t:0,warn:0.8,dur:0.6,w:28,c:this.color});
          this.cd=1.6;
        }
      }
    }else if(this.st==='beam'){if(this.stT>1.4)this.st='idle';}
  }
  // L5 — block rain + ground-pound shockwaves
  b_blocks(dt,g,p,pcx){
    if(this.st==='idle'){
      this.vx=this.dir*55;this.cd-=dt;
      if(this.cd<=0){
        this.mode=(this.mode+1)%2;
        if(this.mode===1){
          const xs=[pcx];for(let i=0;i<3+Math.floor(this.li/3);i++)xs.push(this.A+40+Math.random()*(BASE_W-80));
          xs.forEach((x,i)=>g.projs.push(new Proj('block',x,-30-i*70,0,0,this.color,2,{g:650})));
          this.cd=2;Sfx.roar();
        }else{this.st='jump';this.stT=0;this.vy=-640;this.vx=clamp((pcx-this.cx)*0.9,-300,300);}
      }
    }else if(this.st==='jump'){
      if(this.onGround&&this.stT>0.1){
        this.st='idle';this.vx=0;g.shake(0.4);Sfx.hammer();g.shock(this.cx,GROUND_Y,this.color,1.3);g.dust(this.cx,GROUND_Y,14);
        for(const d of[-1,1])g.projs.push(new Proj('wave',this.cx,GROUND_Y-16,d*300,0,this.color,1,{life:2.4}));
        this.cd=1.6;
      }
    }
  }
  // L6 — insanely fast ninja: dashes, jumps, shuriken
  b_speedy(dt,g,p,pcx){
    if(this.st==='idle'){
      this.vx=this.dir*150;this.cd-=dt;
      if(this.cd<=0){
        const r=Math.random();
        if(r<0.4){this.st='dash';this.stT=0;this.vx=this.dir*660;Sfx.dive();}
        else if(r<0.7&&this.onGround){this.vy=-700;this.vx=this.dir*280;this.cd=0.7;}
        else{for(let i=-1;i<=1;i++)g.projs.push(new Proj('star',this.cx,this.cy-10,this.dir*360,i*70,this.color,1));Sfx.shoot();this.cd=0.8;}
      }
    }else if(this.st==='dash'){
      this.ghostT-=dt;if(this.ghostT<=0){this.ghostT=0.03;g.vfx.push(new Ghost(this.x,this.y,this.w,this.h,this.color));}
      if(this.hitWall||this.stT>0.9){this.st='idle';this.vx=0;this.cd=0.6;}
    }
  }
  // L7 — bouncing slime that splits into minions
  b_splits(dt,g,p,pcx){
    if(this.onGround){
      this.vx*=Math.pow(0.01,dt);
      if(!this.landed){
        this.landed=true;g.shake(0.2);g.shock(this.cx,GROUND_Y,this.color,0.9);
        if(this.hp<this.maxHp/2)for(const d of[-1,1])g.projs.push(new Proj('acid',this.cx,this.y+10,d*rnd(120,220),-420,this.color,1,{g:900}));
      }
      this.cd-=dt;
      if(this.cd<=0){this.vy=-560-Math.random()*200;this.vx=clamp((pcx-this.cx)*1.1,-320,320);this.cd=rnd(0.9,1.5);this.landed=false;}
    }
  }
  // L8 — exoskeleton: homing missiles, shield, machine-gun
  b_mech(dt,g,p,pcx){
    if(this.st==='idle'){
      this.vx=this.dir*60;this.cd-=dt;
      if(this.cd<=0){
        this.mode=(this.mode+1)%3;
        if(this.mode===0){for(const s of[-1,1])g.projs.push(new Proj('missile',this.cx,this.y+10,s*120,-260,this.color,2,{homing:2.2,life:4}));Sfx.shoot();this.cd=1.8;}
        else if(this.mode===1){this.st='shield';this.stT=0;this.shield=1.4;this.vx=0;}
        else{this.st='gun';this.stT=0;this.vx=0;this.shots=0;}
      }
    }else if(this.st==='shield'){if(this.stT>1.4){this.st='idle';this.cd=0.6;}}
    else if(this.st==='gun'){
      if(this.stT>0.12*this.shots+0.3){
        this.shots++;g.fireAt(this.cx+this.dir*this.w/2,this.y+this.h*0.4,pcx,p.y+p.h/2,380,this.color,1);Sfx.shoot();
        if(this.shots>=6){this.st='idle';this.cd=1.2;}
      }
    }
  }
  // L9 — hologram that spawns clones of itself
  b_mirror(dt,g,p,pcx){
    this.vx=this.dir*70;this.cd-=dt;
    if(this.cd<=0){
      const clones=g.enemies.filter(e=>e.type==='clone').length;
      if(clones<2&&Math.random()<0.6){
        for(let i=clones;i<2;i++)g.enemies.push(new Enemy('clone',this.A+80+Math.random()*(BASE_W-200),GROUND_Y,this.li,BOSS_LOOKS[8],this.h/80));
        g.glitch(this);Sfx.laser();this.cd=1.4;
      }else{

    const P={mv:Math.min(1,Math.abs(this.vx)/50),ph:this.walkPh||0,t:this.t,seed:2,drunk:0.25,flash,
      lean:st==='charge'?0.32:st==='dash'?0.38:st==='windup'?-0.12:0,
      reach:['charge','slash','dash','gun','appear'].includes(st)?1:0,reach2:(st==='charge'||st==='windup')?1:undefined,
      talk:(st==='windup'||(this.say&&Math.sin(this.t*24)>0))?1:0,brow:1,

    if(li===9&&this.phase>=2){ctx.fillStyle=c;ctx.globalAlpha=this.alpha*0.45;[1,-1].forEach(d=>{ctx.beginPath();ctx.moveTo(cx,cy-this.h*0.25);ctx.bezierCurveTo(cx+d*95,cy-85,cx+d*105,cy+10,cx+d*30,cy+this.h*0.1);ctx.closePath();ctx.fill();});ctx.globalAlpha=this.alpha;}

      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy+4,16,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over';
    }else if(li===4){

  _mech(cx,fy,c,L,P){

    ctx.fillStyle='#333';ctx.fillRect(this.dir>0?cx+w/2-4:cx-w/2-22,top+h*0.48,26,8);

// ─── PROJECTILES ─────────────────────────────────────────────────────────
const PROJ_R={glass:6,vinyl:12,block:16,star:8,orb:7,missile:7,wave:14,shot:6,acid:8};
class Proj{
  constructor(kind,x,y,vx,vy,color,dmg,o={}){
    this.kind=kind;this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.dmg=dmg;this.t=0;
    this.g=o.g||0;this.life=o.life||5;this.homing=o.homing||0;this.r=PROJ_R[kind]||7;
  }
  update(dt,g){
    this.t+=dt;const p=g.player;
    if(this.homing){
      const a=Math.atan2(p.y+p.h/2-this.y,p.x+p.w/2-this.x),cur=Math.atan2(this.vy,this.vx);
      let da=a-cur;da=Math.atan2(Math.sin(da),Math.cos(da));
      const na=cur+clamp(da,-this.homing*dt,this.homing*dt),ns=Math.min(Math.hypot(this.vx,this.vy)+dt*120,320);
      this.vx=Math.cos(na)*ns;this.vy=Math.sin(na)*ns;
      if(Math.random()<0.6)g.vfx.push(new Particle(this.x,this.y,rnd(-20,20),rnd(-20,20),'#ffaa44',0.3,2,0));
    }
    this.vy+=this.g*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.kind==='wave'){this.y=GROUND_Y-16;if(Math.random()<0.5)g.vfx.push(new Particle(this.x,GROUND_Y-2,rnd(-40,40),rnd(-160,-60),this.color,0.4,2.5,300));}
    else if(this.y+this.r>=GROUND_Y&&this.y<GROUND_Y+20&&g.groundAt(this.x)){this.explode(g);return false;}
    if(p.inv<=0&&circleRect(this.x,this.y,this.r*0.8,p.hurtBox())){g.hurtPlayer(this.dmg,this.x);g.sparks(this.x,this.y,this.color,8);return false;}
    if((this.life-=dt)<=0)return false;
    return !(this.x<g.camX-120||this.x>g.camX+BASE_W+120||this.y>BASE_H+60||this.y<-500);
  }
  explode(g){
    if(this.kind==='vinyl'){g.explosion(this.x,GROUND_Y-12,58,this.color,2);}
    else if(this.kind==='block'){g.sparks(this.x,GROUND_Y-10,this.color,14,240);g.shake(0.12);Sfx.hit();
      const p=g.player;if(p.inv<=0&&Math.abs(p.x+p.w/2-this.x)<26&&p.y+p.h>GROUND_Y-20)g.hurtPlayer(this.dmg,this.x);}
    else if(this.kind==='glass'){g.sparks(this.x,GROUND_Y-6,'#e8f6ff',10,200);g.sparks(this.x,GROUND_Y-6,this.color,8,140);Sfx.glass();}
    else g.sparks(this.x,GROUND_Y-4,this.color,6,160);
  }
  draw(){
    const x=this.x,y=this.y,c=this.color;
    ctx.save();
    switch(this.kind){
      case'glass':
        ctx.translate(x,y);ctx.rotate(this.t*12);ctx.fillStyle=c;ctx.fillRect(-3,-2,6,6);
        ctx.strokeStyle='rgba(230,248,255,0.9)';ctx.lineWidth=1.2;ctx.strokeRect(-3.5,-6,7,10.5);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(-2.5,-5,1,8);break;
      case'vinyl':
        ctx.translate(x,y);ctx.rotate(this.t*14);
        ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.arc(0,0,12,0,TAU);ctx.fill();
        ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.shadowBlur=10;ctx.shadowColor=c;ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=0.7;ctx.beginPath();ctx.arc(0,0,8,0,2);ctx.stroke();
        ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill();break;
      case'block':{
        const warn=GROUND_Y-y;
        if(warn>40){ctx.globalAlpha=clamp(1-warn/600,0.15,0.8);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-12,GROUND_Y-2);ctx.lineTo(x+12,GROUND_Y-2);ctx.lineTo(x,GROUND_Y-16);ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
        ctx.translate(x,y);
        ctx.fillStyle=c;ctx.shadowBlur=14;ctx.shadowColor=c;ctx.fillRect(-16,-16,32,32);ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillRect(-16,-16,32,5);ctx.fillRect(-16,-16,5,32);
        ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(-16,11,32,5);ctx.fillRect(11,-16,5,32);break;}
      case'star':
        ctx.translate(x,y);ctx.rotate(this.t*20);ctx.fillStyle='#ddd';ctx.shadowBlur=10;ctx.shadowColor=c;
        ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?3:9,a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();break;
      case'missile':
        ctx.translate(x,y);ctx.rotate(Math.atan2(this.vy,this.vx));
        ctx.fillStyle='#ccc';ctx.fillRect(-8,-3,14,6);ctx.fillStyle=c;ctx.fillRect(4,-3,4,6);
        ctx.globalCompositeOperation='lighter';ctx.fillStyle='#ff8800';ctx.beginPath();ctx.moveTo(-8,-3);ctx.lineTo(-16-Math.random()*6,0);ctx.lineTo(-8,3);ctx.fill();break;
      case'wave':{
        ctx.globalCompositeOperation='lighter';
        const wg=ctx.createLinearGradient(0,y-14,0,y+16);wg.addColorStop(0,'rgba(0,0,0,0)');wg.addColorStop(1,c);
        ctx.fillStyle=wg;ctx.beginPath();ctx.moveTo(x-18,y+16);ctx.quadraticCurveTo(x,y-26,x+18,y+16);ctx.closePath();ctx.fill();break;}
      case'acid':
        ctx.fillStyle=c;ctx.shadowBlur=10;ctx.shadowColor=c;ctx.beginPath();ctx.ellipse(x,y,8,6+Math.sin(this.t*20),0,0,TAU);ctx.fill();break;
      default:{
        ctx.globalCompositeOperation='lighter';
        const og=ctx.createRadialGradient(x,y,0,x,y,this.r*2);og.addColorStop(0,'#ffffff');og.addColorStop(0.35,c);og.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=og;ctx.beginPath();ctx.arc(x,y,this.r*2,0,TAU);ctx.fill();}
    }
    ctx.restore();
  }
}

// ─── PICKUPS (drinks + boss perk capsule) ────────────────────────────────
class Pickup{
  constructor(kind,x,y,perk){
    this.kind=kind;this.x=x;this.y=y;this.vy=-220;this.t=Math.random()*3;this.perk=perk;
    this.w=kind==='capsule'?26:16;this.h=kind==='capsule'?34:22;this.onGround=false;this.surf=null;this.life=kind==='drink'?14:1e9;
  }
  update(dt,g){
    this.t+=dt;const p=g.player,pcx=p.x+p.w/2,pcy=p.y+p.h/2,cx=this.x+this.w/2,cy=this.y+this.h/2;
    if(this.kind==='drink'&&p.perk.drinkMagnet&&Math.hypot(pcx-cx,pcy-cy)<180){this.x+=(pcx-cx)*dt*7;this.y+=(pcy-cy)*dt*7;this.vy=0;}
    else if(!this.onGround){this.vy=Math.min(this.vy+GRAV*0.6*dt,600);const pb=this.y+this.h;this.y+=this.vy*dt;landOn(this,pb,g.world.surfaces(),false);}
    if(overlap({x:this.x,y:this.y,w:this.w,h:this.h},p.hurtBox())){g.collect(this);return false;}
    return(this.life-=dt)>0&&this.y<BASE_H+40;
  }
  draw(){
    const bob=this.onGround?Math.sin(this.t*4)*2-2:0,x=this.x,y=this.y+bob;
    ctx.save();
    if(this.kind==='drink'){
      if(this.life<3&&Math.floor(this.t*10)%2)ctx.globalAlpha=0.4;
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.shadowBlur=12;ctx.shadowColor='#ff00ff';
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+16,y);ctx.lineTo(x+8,y+10);ctx.closePath();ctx.stroke();
      ctx.fillStyle='#ff00aa';ctx.beginPath();ctx.moveTo(x+2,y+1.5);ctx.lineTo(x+14,y+1.5);ctx.lineTo(x+8,y+8.5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+8,y+10);ctx.lineTo(x+8,y+19);ctx.moveTo(x+3,y+20);ctx.lineTo(x+13,y+20);ctx.stroke();
      ctx.strokeStyle='#00f3ff';ctx.beginPath();ctx.moveTo(x+10,y+3);ctx.lineTo(x+15,y-6);ctx.stroke();
      ctx.fillStyle='#39ff14';ctx.beginPath();ctx.arc(x+3,y,2.5,0,TAU);ctx.fill();
    }else{
      const c=this.perk.color,cx=x+this.w/2;
      ctx.globalCompositeOperation='lighter';
      const rg=ctx.createRadialGradient(cx,y+17,0,cx,y+17,50);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.35+0.15*Math.sin(this.t*5);ctx.fillStyle=rg;ctx.fillRect(cx-50,y-33,100,100);
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      const cg=ctx.createLinearGradient(x,0,x+this.w,0);cg.addColorStop(0,'#222');cg.addColorStop(0.5,c);cg.addColorStop(1,'#222');
      ctx.fillStyle=cg;ctx.shadowBlur=18;ctx.shadowColor=c;ctx.beginPath();ctx.roundRect(x,y,this.w,this.h,12);ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#000';ctx.fillRect(x+2,y+14,this.w-4,6);
      ctx.fillStyle='#fff';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.perk.tag,cx,y+17.5);
      ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(cx,y+17,22,6,Math.sin(this.t)*0.3,0,TAU);ctx.stroke();
    }
    ctx.restore();
  }

// ─── TOUCH CONTROLS: arrow D-pad + action buttons on a deck BELOW the game ─
class Touch{
  constructor(g){
    this.g=g;this.s={};this.p={};this.touches={};this.used=false;
    this.pause={x:BASE_W-26,y:70,r:16};
    this.layout();
    const h=e=>{
      e.preventDefault();this.used=true;Sfx.init();
      for(const t of e.changedTouches){
        const p=this.toBase(t.clientX,t.clientY);
        if(e.type==='touchend'||e.type==='touchcancel')delete this.touches[t.identifier];
        else this.touches[t.identifier]=p;
        if(e.type==='touchstart'){
          const gp={x:p.x-GX,y:p.y};
          if(g.state!=='playing'||Math.hypot(gp.x-this.pause.x,gp.y-this.pause.y)<26)g.tap(gp);
        }
      }
      this.rebuild();
    };
    ['touchstart','touchmove','touchend','touchcancel'].forEach(n=>canvas.addEventListener(n,h,{passive:false}));
    document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault());
  }
  layout(){
    const u=clamp(PANEL||300,200,380),k=u/320,cy=BASE_H+(PANEL||0)-u/2;
    const s=Math.round(78*k);
    this.dpad={x:40+s*1.5,y:cy,s};
    const rj=62*k,jx=TW-40-rj;
    this.btns=[
      {id:'jump',x:jx,       y:cy+10*k,r:rj,  label:'JUMP',c:'#00f3ff'},
      {id:'atk', x:jx-130*k, y:cy-62*k,r:48*k,label:'ATK', c:'#bd00ff'},
      {id:'kick',x:jx-145*k, y:cy+72*k,r:48*k,label:'KICK',c:'#ff007f'},
      {id:'wpn', x:jx-255*k, y:cy+92*k,r:34*k,label:'WPN', c:'#ffcc00'},
    ];
  }
  toBase(x,y){const r=canvas.getBoundingClientRect();return{x:(x-r.left)*TW/r.width,y:(y-r.top)*(BASE_H+PANEL)/r.height};}
  rebuild(){
    const prev=this.s,s={},D=this.dpad,half=D.s*0.5,reach=D.s*1.9;
    for(const p of Object.values(this.touches)){
      const dx=p.x-D.x,dy=p.y-D.y;
      if(Math.abs(dx)<reach&&Math.abs(dy)<reach&&p.y>BASE_H-10){
        if(dx<-half)s.left=true;if(dx>half)s.right=true;
        if(dy<-half)s.up=true;if(dy>half)s.down=true;
        continue;
      }
      for(const b of this.btns)if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.25)s[b.id]=true;
    }
    for(const k in s)if(s[k]&&!prev[k])this.p[k]=true;

  }
  draw(){
    const D=this.dpad,S=D.s,r=S*0.18;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    // cross-shaped base
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(D.x-S*1.55,D.y-S*0.55,S*3.1,S*1.1,r*1.4);ctx.roundRect(D.x-S*0.55,D.y-S*1.55,S*1.1,S*3.1,r*1.4);ctx.fill();

      ctx.strokeStyle=on?'#ffffff':'rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(cx-S*0.4,cy-S*0.4,S*0.8,S*0.12);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.atan2(dy,dx));
      ctx.fillStyle=on?'#ffffff':'#ff7ac0';ctx.beginPath();ctx.moveTo(S*0.22,0);ctx.lineTo(-S*0.13,-S*0.22);ctx.lineTo(-S*0.13,S*0.22);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.font=`${Math.round(S*0.2)}px ${FONT}`;ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText('▲ = JUMP',D.x,D.y-S*1.75);ctx.fillText('▼+JUMP = DROP',D.x,D.y+S*1.75);
    for(const b of this.btns){
      const on=this.s[b.id];
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);
      ctx.fillStyle=on?b.c:'rgba(10,0,20,0.6)';ctx.globalAlpha=on?0.55:1;ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=on?b.c:'rgba(255,255,255,0.4)';ctx.lineWidth=2.5;ctx.shadowBlur=on?18:6;ctx.shadowColor=b.c;ctx.stroke();ctx.shadowBlur=0;
      ctx.fillStyle=on?'#fff':b.c;ctx.font=`bold ${Math.round(b.r*0.62)}px ${FONT}`;ctx.fillText(b.label,b.x,b.y+1);
    }
    ctx.restore();
  }
}

const DISCO=['#ff2a6d','#05d9e8','#ffd319','#39ff14','#d300c5'];
// ─── GAME ────────────────────────────────────────────────────────────────
class Game{
  constructor(){
    this.state='loading';this.stateT=0;this.t=0;this.keys={};this.pressed={};this.hitStop=0;this.shakeT=0;
    this.li=0;this.lv=LEVELS[0];this.camX=0;this.score=0;this.unlocked=[];
    this.player=new Player();this.demo=new Player();
    this.bd=new Backdrop();this.lights=new LightLayer();this.tc=new Touch(this);
    this.enemies=[];this.projs=[];this.beams=[];this.pick=[];this.vfx=[];this.corpses=[];this.banner=null;this.pSay=null;
    this.titleGuy=makeLook(Math.random,'vice');this.titleLine=0;

  _bind(){
    addEventListener('keydown',e=>{
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
      Sfx.init();
      if(!e.repeat){this.pressed[e.code]=true;this.menuKey(e.code);}
      this.keys[e.code]=true;
    });
    addEventListener('keyup',e=>{this.keys[e.code]=false;});
    addEventListener('blur',()=>{this.keys={};this.pause();});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pause();});
    canvas.addEventListener('mousedown',e=>{Sfx.init();const p=this.tc.toBase(e.clientX,e.clientY);this.tap({x:p.x-GX,y:p.y});});
  }
  get outfitBtn(){return{x:BASE_W/2-130,y:282,w:260,h:44};}
  menuKey(c){
    const ok=c==='Enter'||c==='Space';
    switch(this.state){
      case'title':if(ok)this.newGame();break;
      case'playing':if(c==='KeyP'||c==='Escape')this.pause();if(c==='KeyM')Sfx.toggleMusic();break;
      case'paused':if(c==='KeyP'||c==='Escape'||c==='Enter')this.resume();if(c==='KeyO')this.cycleOutfit();if(c==='KeyM')Sfx.toggleMusic();break;
      case'perk':if(ok&&this.stateT>0.7)this.applyPerk();break;
      case'gameover':case'win':if(ok&&this.stateT>1)this.newGame();break;
    }
  }
  tap(p){
    switch(this.state){
      case'title':if(this.stateT>0.3)this.newGame();break;
      case'playing':if(Math.hypot(p.x-this.tc.pause.x,p.y-this.tc.pause.y)<26)this.pause();break;
      case'paused':if(overlap({x:p.x,y:p.y,w:1,h:1},this.outfitBtn))this.cycleOutfit();else this.resume();break;
      case'perk':if(this.stateT>0.7)this.applyPerk();break;
      case'gameover':case'win':if(this.stateT>1)this.newGame();break;
    }
  }
  pause(){if(this.state==='playing'){this.state='paused';this.stateT=0;Sfx.stopMusic();}}
  resume(){if(this.state==='paused'){this.state='playing';this.pressed={};this.tc.p={};Sfx.startMusic(this.lv.root);}}
  cycleOutfit(){const p=this.player,list=[null,...p.outfits];p.outfit=list[(list.indexOf(p.outfit)+1)%list.length];Sfx.hit();}
  newGame(){
    Sfx.init();this.score=0;this.player=new Player();this.unlocked=[];

  }
  startLevel(i){
    this.li=i;const lv=LEVELS[i];this.lv=lv;
    this.world=new World(i);
    this.enemies=[];this.boss=null;this.projs=[];this.beams=[];this.pick=[];this.vfx=[];this.corpses=[];this.pSay=null;this.lights.lights=[];
    this.kills=0;this.quota=10+i*2;this.spawnT=1.2;this.bossStarted=false;this.bossDone=false;this.locked=false;this.gateOpened=false;this.winT=0;

  get minX(){return this.locked?this.world.AX:0;}

  // fx helpers

  dust(x,y,n=6){for(let i=0;i<n;i++)this.vfx.push(new Particle(x+rnd(-8,8),y-2,rnd(-90,90),rnd(-80,-20),'#6a5a80',0.35,2,200));}

  hearts(e){for(let i=0;i<3;i++)this.vfx.push(new Popup(e.x+e.w/2+rnd(-12,12),e.y-22-i*7,'♥','#ff4f9a'));}
  playerSay(lines){if(!this.pSay)this.pSay={txt:pick(Math.random,lines),t:1.3};}
  throwDrink(e){
    const p=this.player,G=900,sx=e.x+e.w/2+e.dir*8,sy=e.y+e.h*0.25,tt=clamp(Math.abs(p.x-e.x)/420,0.55,1.05);

  surfBelow(x,y){let best=BASE_H+200;for(const s of this.world.surfaces())if(x>=s.x&&x<=s.x+s.w&&s.y>=y-2&&s.y<best)best=s.y;return best;}

    this.ring(x,y,c,r/60);this.shock(x,GROUND_Y,c,r/60);this.sparks(x,y,c,18,320);this.lights.add(x,y,r*2.2,c,0.4,1);Sfx.explode();this.shake(0.2);

  hurtPlayer(d,srcX){
    const p=this.player;
    if(!p.takeDamage(d,srcX,this))return;
    Sfx.hurt();this.shake(0.22);this.sparks(p.x+p.w/2,p.y+p.h/2,'#ff2244',12);this.lights.add(p.x+p.w/2,p.y+p.h/2,120,'#ff0033',0.3,0.9);

  revenge(){

    this.ring(cx,cy,'#ff5500',3);this.ring(cx,cy,'#ffffff',2);this.lights.add(cx,cy,400,'#ff5500',0.5,1);this.popup(cx,p.y-16,'RETALIATION!','#ff5500');Sfx.hammer();

  resolveMelee(pd){
    const p=this.player,hb=pd.hb;let hits=0;
    if(pd.kind==='kick'){const fx=p.dir>0?hb.x+hb.w*0.8:hb.x+hb.w*0.2;for(let i=0;i<8;i++)this.vfx.push(new Particle(fx,hb.y+hb.h/2,p.dir*rnd(60,260),rnd(-140,60),Math.random()<0.5?p.color:'#ffffff',0.3,2.2,300));this.lights.add(fx,hb.y+10,90,p.color,0.18,0.9);}
    if(pd.kind==='katana')this.lights.add(p.x+p.w/2+p.dir*30,p.y+p.h/2,120,'#00f3ff',0.22,1);
    if(pd.kind==='hammer'){
      Sfx.hammer();const ix=p.x+p.w/2+p.dir*40,iy=p.y+p.h;
      this.shock(ix,iy,p.color,1.3);this.ring(ix,iy-10,'#bd00ff',1);this.shake(0.25);this.lights.add(ix,iy,170,'#bd00ff',0.35,1.1);
      this.dust(ix,iy,10);for(let i=0;i<12;i++)this.vfx.push(new Particle(ix+rnd(-30,30),iy-4,rnd(-160,160),rnd(-380,-120),Math.random()<0.5?'#bd00ff':p.color,0.6,3,900));

  killEnemy(e){

    };

  update(dt){

    p.update(dt,inp,this);
    if(p.y>BASE_H+60)this.pitFall();
    if(p.pending&&(p.pending.t-=dt)<=0){const pd=p.pending;p.pending=null;this.resolveMelee(pd);}
    if(p.diving)this.diveCheck();
    for(const e of this.enemies){
      e.update(dt,this);
      if(e.contact&&e.hp>0&&e.stun<=0&&p.inv<=0&&overlap(e.box(),p.hurtBox()))this.hurtPlayer(e.dmg,e.x+e.w/2);
    }
    this.enemies=this.enemies.filter(e=>{
      if(e.hp<=0||e.y>BASE_H+80){this.killEnemy(e);return false;}
      return Math.abs(e.x-p.x)<1100;
    });
    if(!this.bossStarted)this.spawner(dt);
    const A=this.world.AX;
    if(!this.bossStarted&&this.kills>=this.quota&&!this.gateOpened){this.gateOpened=true;this.banner={a:'VIP ROOM OPEN',b:'THE BOSS AWAITS  ▶▶',t:2.2,c:'#39ff14'};Sfx.level();}
    if(this.gateOpened&&!this.bossStarted&&p.x>A+40)this.startBoss();
    if(this.boss){
      const b=this.boss;b.update(dt,this);
      if(b.contact&&b.st!=='enter'&&b.alpha>0.5&&p.inv<=0&&overlap(b.box(),p.hurtBox()))this.hurtPlayer(2,b.cx);
      if(b.hp<=0)this.bossDeath();
    }
    this.projs=this.projs.filter(pr=>pr.update(dt,this));
    this.beams=this.beams.filter(bm=>{
      bm.t+=dt;
      if(bm.t>bm.warn&&!bm.fired){bm.fired=true;Sfx.laser();this.shake(0.15);this.lights.add(bm.x,GROUND_Y,160,bm.c,bm.dur,1);}
      if(bm.t>bm.warn&&p.inv<=0&&Math.abs(p.x+p.w/2-bm.x)<bm.w/2+p.w/2-4)this.hurtPlayer(2,bm.x);
      return bm.t<bm.warn+bm.dur;
    });
    this.pick=this.pick.filter(k=>k.update(dt,this));
    this.vfx=this.vfx.filter(v=>v.update(dt));
    this.corpses=this.corpses.filter(c=>c.update(dt));
    if(this.pSay&&(this.pSay.t-=dt)<=0)this.pSay=null;
    if(this.vfx.length>500)this.vfx.splice(0,this.vfx.length-500);
    this.lights.update(dt);
    if(this.shakeT>0)this.shakeT-=dt;
    if(this.banner&&(this.banner.t-=dt)<=0)this.banner=null;
    let tx=this.locked?A:p.x+p.w/2-BASE_W*0.42+p.dir*30;
    tx=clamp(tx,0,A);
    this.camX+=(tx-this.camX)*Math.min(1,dt*(this.locked?3:6));
    if(this.winT>0&&(this.winT-=dt)<=0){this.state='win';this.stateT=0;Sfx.stopMusic();Sfx.perk();}
    if(p.hp<=0&&this.state==='playing'){this.state='gameover';this.stateT=0;Sfx.stopMusic();Sfx.over();}
  }
  loadTick(){
    if(!this.fontReq){
      this.fontReq=true;this.fontOK=false;const done=()=>{this.fontOK=true;};
      try{Promise.all([document.fonts.load('20px VT323'),document.fonts.load('40px Monoton')]).then(done,done);}catch(e){done();}
      setTimeout(done,2500);
    }
    if(!this.fontOK)return;
    if(!this.loadQ){
      this.loadQ=[];
      LEVELS.forEach((lv,i)=>this.loadQ.push(()=>Tex.floor(lv.ac),()=>Tex.plat(lv.ac),()=>Tex.sky('far',i),()=>Tex.sky('mid',i),()=>Tex.sun(i),()=>prepLook(BOSS_LOOKS[i])));
      this.loadQ.push(()=>Tex.vignette(),()=>Tex.scanlines(),()=>Tex.truss());
      this.loadN=this.loadQ.length;
    }
    const t0=performance.now();
    while(this.loadQ.length&&performance.now()-t0<10)this.loadQ.shift()();
    if(!this.loadQ.length&&this.stateT>0.8){this.state='title';this.stateT=0;this.camX=0;}
  }

  _draw(){
    if(this.state==='loading')return this.drawLoading();
    if(this.state==='title')return this.drawTitle();
    const ac=this.acc(),beat=this.beat();
    this.bd.draw(this.camX,this.li,this.t,ac,beat);
    let sx=0,sy=0;if(this.shakeT>0){const m=Math.min(1,this.shakeT*4)*8;sx=rnd(-m,m);sy=rnd(-m,m);}
    ctx.save();
    ctx.translate(sx-Math.round(this.camX*RES)/RES,sy);
    this.drawWorld(ac,beat);
    for(const c of this.corpses)c.draw();
    for(const k of this.pick)k.draw();
    for(const e of this.enemies)e.draw();
    if(this.boss)this.boss.draw();
    this.player.draw();
    for(const pr of this.projs)pr.draw();
    this.drawBeams();
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const v of this.vfx)if(v instanceof Particle)v.draw();
    ctx.restore();ctx.globalAlpha=1;
    for(const v of this.vfx)if(!(v instanceof Particle))v.draw();
    const p=this.player,aura=[[p.x+p.w/2,p.y+p.h/2,85,p.color,0.34]];
    if(this.boss)aura.push([this.boss.cx,this.boss.cy,this.boss.w*1.4,this.boss.color,0.25]);
    this.lights.draw(aura);
    for(const e of this.enemies)e.drawSay();
    if(this.boss)this.boss.drawSay();
    if(this.pSay)drawBubble(p.x+p.w/2,p.y-12,this.pSay.txt,'#ff007f',Math.min(1,this.pSay.t*4));
    ctx.restore();
    ctx.drawImage(Tex.vignette(),0,0,BASE_W,BASE_H);
    ctx.drawImage(Tex.scanlines(),0,0,BASE_W,BASE_H);
    this.hud(ac);
    if(!PANEL&&(IS_TOUCH||this.tc.used))this.tc.draw();
    this.drawPauseBtn();
    if(this.banner)this.drawBanner();
    if(this.state==='perk')this.drawPerk();
    if(this.state==='paused')this.drawPause();
    if(this.state==='gameover')this.drawGameOver();

  drawPauseBtn(){
    if(this.state!=='playing')return;
    const b=this.tc.pause;ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(b.x-5,b.y-6,3.5,12);ctx.fillRect(b.x+1.5,b.y-6,3.5,12);ctx.restore();
  }
  drawBanner(){
    const b=this.banner,a=Math.min(1,b.t*2,(2.8-b.t)*3);
    ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,118,BASE_W,72);
    ctx.font=`bold 39px ${FONT}`;ctx.fillStyle=b.c;ctx.shadowBlur=24;ctx.shadowColor=b.c;ctx.fillText(b.a,BASE_W/2,142);
    ctx.font=`bold 20px ${FONT}`;ctx.fillStyle='#ffffff';ctx.shadowBlur=8;ctx.fillText(b.b,BASE_W/2,172);
    ctx.restore();
  }
  overlay(a=0.82){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,BASE_W,BASE_H);}
  neonText(txt,x,y,size,c,blur=20){ctx.font=`bold ${Math.round(size*1.3)}px ${FONT}`;ctx.fillStyle=c;ctx.shadowBlur=blur;ctx.shadowColor=c;ctx.fillText(txt,x,y);ctx.shadowBlur=0;}
  blink(){return Math.floor(this.t*2.5)%2===0;}
  drawPerk(){
    const pk=PERKS[this.li];ctx.save();this.overlay();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle=pk.color;ctx.lineWidth=2;ctx.shadowBlur=24;ctx.shadowColor=pk.color;ctx.strokeRect(BASE_W/2-200,BASE_H/2-130,400,260);ctx.shadowBlur=0;
    this.neonText(pk.outfit?'NEW OUTFIT UNLOCKED':'PERK UNLOCKED',BASE_W/2,BASE_H/2-96,22,pk.color);
    ctx.save();ctx.translate(BASE_W/2,BASE_H/2-40);ctx.rotate(Math.sin(this.t*2)*0.1);
    ctx.fillStyle=pk.color;ctx.shadowBlur=30;ctx.shadowColor=pk.color;ctx.beginPath();ctx.roundRect(-22,-26,44,52,18);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font=`bold 21px ${FONT}`;ctx.fillText(pk.tag,0,1);ctx.restore();
    this.neonText(pk.name.toUpperCase(),BASE_W/2,BASE_H/2+20,20,'#ffffff',6);
    ctx.font=`18px ${FONT}`;ctx.fillStyle='#ccc';ctx.fillText(pk.desc,BASE_W/2,BASE_H/2+50);
    if(pk.outfit){ctx.font=`14px ${FONT}`;ctx.fillStyle=pk.color;ctx.fillText('Equipped. Swap outfits any time in the pause menu.',BASE_W/2,BASE_H/2+74);}
    if(this.stateT>0.7&&this.blink()){ctx.font=`bold 17px ${FONT}`;ctx.fillStyle='#39ff14';ctx.fillText((IS_TOUCH?'TAP':'PRESS ENTER')+' FOR LEVEL '+(this.li+2),BASE_W/2,BASE_H/2+108);}
    ctx.restore();
  }
  drawPause(){
    const p=this.player;ctx.save();this.overlay(0.75);ctx.textAlign='center';ctx.textBaseline='middle';
    this.neonText('PAUSED',BASE_W/2,120,40,'#00f3ff');
    ctx.font=`17px ${FONT}`;ctx.fillStyle='#aaa';ctx.fillText(`LEVEL ${this.li+1} · SCORE ${this.score}`,BASE_W/2,162);
    ctx.fillText('OUTFIT',BASE_W/2,256);
    const b=this.outfitBtn;
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor=p.color;ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;
    ctx.font=`bold 20px ${FONT}`;ctx.fillStyle=p.color;ctx.fillText('◀  '+(p.outfit?OUTFIT_NAMES[p.outfit]:'STREET (DEFAULT)')+'  ▶',BASE_W/2,b.y+b.h/2+1);
    ctx.font=`14px ${FONT}`;ctx.fillStyle='#888';
    ctx.fillText(p.outfits.length?(IS_TOUCH?'Tap the box to change outfit':'Press O to change outfit'):'Beat bosses on levels 2, 4, 6, 8 to unlock outfits',BASE_W/2,344);
    ctx.fillText(IS_TOUCH?'Tap anywhere else to resume':'P / ESC / ENTER to resume   ·   M: music '+(Sfx.musicOn?'ON':'OFF'),BASE_W/2,400);
    ctx.restore();
  }
  drawGameOver(){
    ctx.save();this.overlay(0.85);ctx.textAlign='center';ctx.textBaseline='middle';
    this.neonText('GAME OVER',BASE_W/2,BASE_H/2-50,54,'#ff2244',30);
    ctx.font=`20px ${FONT}`;ctx.fillStyle='#ccc';ctx.fillText(`LEVEL ${this.li+1} · ${this.lv.name.toUpperCase()}   SCORE ${this.score}`,BASE_W/2,BASE_H/2+4);
    if(this.stateT>1&&this.blink()){ctx.font=`bold 18px ${FONT}`;ctx.fillStyle='#39ff14';ctx.fillText(IS_TOUCH?'TAP TO RETRY':'PRESS ENTER TO RETRY',BASE_W/2,BASE_H/2+50);}
    ctx.restore();
  }
  drawWin(){
    ctx.save();this.overlay(0.85);ctx.textAlign='center';ctx.textBaseline='middle';
    const g=ctx.createLinearGradient(0,BASE_H/2-90,0,BASE_H/2-30);g.addColorStop(0,'#ff007f');g.addColorStop(0.5,'#00f3ff');g.addColorStop(1,'#bd00ff');
    ctx.font=`bold 73px ${FONT}`;ctx.fillStyle=g;ctx.shadowBlur=40;ctx.shadowColor='#ff007f';ctx.fillText('YOU WIN!',BASE_W/2,BASE_H/2-60);ctx.shadowBlur=0;
    ctx.font=`20px ${FONT}`;ctx.fillStyle='#00f3ff';ctx.fillText('THE CYBER EMPEROR HAS FALLEN. FLY GIRL RULES THE NIGHT.',BASE_W/2,BASE_H/2);
    this.neonText('FINAL SCORE '+this.score,BASE_W/2,BASE_H/2+36,20,'#ffcc00',12);
    if(this.stateT>1&&this.blink()){ctx.font=`bold 18px ${FONT}`;ctx.fillStyle='#39ff14';ctx.fillText(IS_TOUCH?'TAP TO PLAY AGAIN':'PRESS ENTER TO PLAY AGAIN',BASE_W/2,BASE_H/2+84);}
    ctx.restore();
  }
  drawLoading(){
    ctx.fillStyle='#050008';ctx.fillRect(0,0,BASE_W,BASE_H);
    const f=this.loadN?1-this.loadQ.length/this.loadN:0;
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    this.neonText('FLY GIRL',BASE_W/2,BASE_H/2-50,40,'#ff007f',30);
    ctx.font=`17px ${FONT}`;ctx.fillStyle='#00f3ff';ctx.fillText('RENDERING NEON TEXTURES... '+Math.floor(f*100)+'%',BASE_W/2,BASE_H/2+4);
    ctx.strokeStyle='#00f3ff';ctx.strokeRect(BASE_W/2-150,BASE_H/2+24,300,10);
    ctx.fillStyle='#ff007f';ctx.shadowBlur=12;ctx.shadowColor='#ff007f';ctx.fillRect(BASE_W/2-148,BASE_H/2+26,296*f,6);
    ctx.restore();
  }
  drawTitle(){
    const lv=LEVELS[0],beat=this.beat();
    this.bd.draw(this.camX,0,this.t,lv.ac,beat);
    if(!this.titlePat)this.titlePat=ctx.createPattern(Tex.floor(lv.ac),'repeat');
    ctx.save();ctx.translate(-(this.camX%48),GROUND_Y);ctx.fillStyle=this.titlePat;ctx.fillRect(0,0,BASE_W+48,BASE_H-GROUND_Y);
    const bt=Math.floor(this.t/0.46);ctx.globalCompositeOperation='lighter';
    for(let ci=0;ci<18;ci++)for(let r=0;r<2;r++)if((ci*7+r*13+bt*5)%11<4){ctx.globalAlpha=0.22+0.18*beat;ctx.fillStyle=DISCO[(ci+r+bt)%5];ctx.fillRect(ci*48+3,r*48+3,42,42);}
    ctx.restore();
    ctx.fillStyle=lv.ac;ctx.shadowBlur=12;ctx.shadowColor=lv.ac;ctx.fillRect(0,GROUND_Y,BASE_W,2);ctx.shadowBlur=0;
    const d=this.demo;d.x=150;d.y=GROUND_Y-d.h;d.dir=1;
    ctx.save();ctx.translate(163,GROUND_Y);ctx.scale(2.2,2.2);ctx.translate(-163,-GROUND_Y);d.draw();ctx.restore();
    const gt=this.t;
    drawDude(ctx,this.titleGuy,{mv:0,t:gt,seed:1,drunk:0.8,sip:Math.max(0,Math.sin(gt*0.9))**4,talk:Math.sin(gt*20)>0&&gt%2.2<1.5?1:0,brow:1,wink:gt%2.2>1.6},712,GROUND_Y,-1,1.25);
    if(this.t%2.2<1.5)drawBubble(712,GROUND_Y-112,LINES_FLIRT[this.titleLine],'#ff4fd8');
    ctx.drawImage(Tex.vignette(),0,0,BASE_W,BASE_H);
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`64px ${LOGO}`;
    const g=ctx.createLinearGradient(0,92,0,150);g.addColorStop(0,'#ffffff');g.addColorStop(0.45,'#9be7ff');g.addColorStop(0.5,'#1a1a4a');g.addColorStop(0.55,'#ff4fd8');g.addColorStop(1,'#ffd6f5');
    ctx.shadowBlur=30;ctx.shadowColor='#ff2a6d';ctx.fillStyle=g;ctx.fillText('FLY GIRL',490,122);ctx.shadowBlur=0;
    ctx.font=`italic bold 30px ${FONT}`;ctx.fillStyle='#ffd319';ctx.shadowBlur=14;ctx.shadowColor='#ff2a6d';ctx.fillText('NEON NIGHTS · 1986',490,176);ctx.shadowBlur=0;
    ctx.font=`20px ${FONT}`;ctx.fillStyle='#05d9e8';ctx.fillText("Creeps at the club? Kick 'em out!  10 clubs · 10 bosses",490,204);
    if(this.blink()){ctx.font=`bold 26px ${FONT}`;ctx.fillStyle='#39ff14';ctx.shadowBlur=12;ctx.shadowColor='#39ff14';ctx.fillText(IS_TOUCH?'TAP TO START':'PRESS ENTER TO START',490,240);ctx.shadowBlur=0;}
    ctx.font=`18px ${FONT}`;ctx.fillStyle='#d8c8e8';
    const lines=IS_TOUCH?['◀ ▶ MOVE   ▲ or JUMP: JUMP   ▼+JUMP: DROP DOWN','KICK in mid-air while falling = DIVE KICK','ATK: weapon attack   WPN: switch Katana / Hammer']
      :['← → / A D: MOVE   SPACE / ↑: JUMP   ↓+SPACE: DROP DOWN','J: KICK  (J while falling = DIVE KICK)','K: SWITCH WEAPON   L: WEAPON ATTACK   P: PAUSE / OUTFITS'];
    lines.forEach((l,i)=>ctx.fillText(l,395,276+i*19));
    ctx.restore();
    ctx.drawImage(Tex.scanlines(),0,0,BASE_W,BASE_H);
  }
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────
game=new Game();fit();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))return;if(dt>0.05)dt=0.05;
  if(game.hitStop>0)game.hitStop-=dt;else game.update(dt);
  game.draw();
}
requestAnimationFrame(frame);
</script>
